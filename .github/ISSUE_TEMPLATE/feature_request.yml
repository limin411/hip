name: Feature request
description: Suggest an enhancement or product change
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and a concrete proposal. Large refactors should start as discussion before a big PR.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should hip behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / UX
        - Agent runtime / tools
        - ACP / external agents
        - Memory / knowledge
        - CLI
        - Build / packaging
        - Docs / i18n
        - Other
    validations:
      required: false

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this
          required: false
