name: Build

# Produces platform installers with the production sidecar layout.
# macOS artifacts are UNSIGNED (HIP_SKIP_SIGN=1) unless release secrets are added later.
# Whisper is off by default (HIP_BUNDLE_WHISPER=0) for faster CI; enable on tags or
# via workflow_dispatch.

on:
  push:
    branches: [main, master, dev, 'dev.*']
    tags: ["v*"]
  pull_request:
    branches: [main, master, dev, 'dev.*']
  workflow_dispatch:
    inputs:
      bundle_whisper:
        description: "Bundle whisper-cli engine (cmake build; slower)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Production sidecar requires Node >= 22.5 (node:sqlite).

jobs:
  package-macos:
    name: package-macos
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn (classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: package-macos

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Resolve whisper bundling
        id: whisper
        shell: bash
        run: |
          set -euo pipefail
          want=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_whisper }}" = "true" ]; then
            want=1
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            want=1
          fi
          echo "bundle=${want}" >> "${GITHUB_OUTPUT}"
          echo "HIP_BUNDLE_WHISPER=${want}"

      - name: Install cmake (whisper)
        if: steps.whisper.outputs.bundle == '1'
        run: brew install cmake

      - name: Package macOS (.app + .dmg)
        env:
          HIP_SKIP_SIGN: "1"
          HIP_BUNDLE_WHISPER: ${{ steps.whisper.outputs.bundle }}
        run: yarn package:macos

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ci/macos
          APP="src-tauri/target/release/bundle/macos/hip.app"
          if [ ! -d "${APP}" ]; then
            echo "error: missing ${APP}" >&2
            ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || true
            exit 1
          fi
          # Tar .app so Actions does not flatten the bundle.
          tar -C src-tauri/target/release/bundle/macos -czf dist-ci/macos/hip.app.tar.gz hip.app
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/hip_*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "error: no hip_*.dmg under bundle/dmg" >&2
            ls -la src-tauri/target/release/bundle/dmg/ 2>/dev/null || true
            exit 1
          fi
          cp -v "${dmgs[@]}" dist-ci/macos/
          # Integrity: production sidecar must be inside the app.
          RUNTIME="${APP}/Contents/Resources/hip-sidecar"
          test -f "${RUNTIME}/node"
          test -f "${RUNTIME}/index.js"
          ls -lh dist-ci/macos/
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          echo "triple=${triple:-unknown}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: hip-macos-${{ steps.collect.outputs.triple }}
          path: dist-ci/macos/
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: package-windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn (classic)
        shell: bash
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: package-windows

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Resolve whisper bundling
        id: whisper
        shell: bash
        run: |
          set -euo pipefail
          want=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_whisper }}" = "true" ]; then
            want=1
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            want=1
          fi
          echo "bundle=${want}" >> "${GITHUB_OUTPUT}"
          echo "HIP_BUNDLE_WHISPER=${want}"

      - name: Install cmake (whisper)
        if: steps.whisper.outputs.bundle == '1'
        shell: bash
        run: |
          set -euo pipefail
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          echo "C:/Program Files/CMake/bin" >> "${GITHUB_PATH}"
          cmake --version

      - name: Package Windows (NSIS)
        shell: pwsh
        env:
          HIP_BUNDLE_WHISPER: ${{ steps.whisper.outputs.bundle }}
        run: yarn package:windows

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ci/windows
          NSIS="src-tauri/target/release/bundle/nsis"
          if [ ! -d "${NSIS}" ]; then
            echo "error: missing ${NSIS}" >&2
            ls -la src-tauri/target/release/bundle/ 2>/dev/null || true
            exit 1
          fi
          shopt -s nullglob
          setups=("${NSIS}"/*.exe)
          if [ "${#setups[@]}" -eq 0 ]; then
            echo "error: no NSIS .exe under ${NSIS}" >&2
            ls -la "${NSIS}" || true
            exit 1
          fi
          cp -v "${setups[@]}" dist-ci/windows/
          ls -lh dist-ci/windows/
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          echo "triple=${triple:-unknown}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: hip-windows-${{ steps.collect.outputs.triple }}
          path: dist-ci/windows/
          if-no-files-found: error
          retention-days: 14

  # Tag-only: attach the platform installers to a GitHub Release.
  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: hip-*
          path: artifacts

      - name: Stage assets and notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' \) -print -exec cp -v {} dist-release/ \;
          ls -lh dist-release/
          count="$(find dist-release -type f | wc -l | tr -d ' ')"
          if [ "${count}" -lt 2 ]; then
            echo "error: expected macOS + Windows assets, found ${count}" >&2
            find artifacts -type f -print >&2 || true
            exit 1
          fi
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt

          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          python3 - "${ver}" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(rf"^## \[{re.escape(ver)}\].*?(?=^## |\Z)", text, re.M | re.S)
          body = m.group(0).strip() if m else f"hip v{ver}"
          warning = (
              "> **Packaging:** GitHub Actions built these installers on this tag. "
              "macOS CI builds are **unsigned** (`HIP_SKIP_SIGN=1`); Gatekeeper may block the app "
              "until you allow it in System Settings → Privacy & Security. "
              "Windows SmartScreen may warn on the unsigned NSIS installer.\n\n"
          )
          pathlib.Path("release-notes.md").write_text(warning + body + "\n")
          PY
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mapfile -t files < <(find dist-release -type f | sort)
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}" --notes-file release-notes.md
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "${tag}" \
              --notes-file release-notes.md
          fi
          gh release view "${tag}"
