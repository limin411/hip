name: Build

# Produces platform installers with the production sidecar layout.
# macOS artifacts are UNSIGNED (HIP_SKIP_SIGN=1) unless release secrets are added later.
# Whisper is off by default (HIP_BUNDLE_WHISPER=0) for faster CI; enable on tags or
# via workflow_dispatch.

on:
  push:
    branches: [main, master, dev, 'dev.*']
    tags: ["v*"]
  pull_request:
    branches: [main, master, dev, 'dev.*']
  workflow_dispatch:
    inputs:
      bundle_whisper:
        description: "Bundle whisper-cli engine (cmake build; slower)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Production sidecar requires Node >= 22.5 (node:sqlite).

jobs:
  package-macos:
    name: package-macos
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn (classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: package-macos

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Resolve whisper bundling
        id: whisper
        shell: bash
        run: |
          set -euo pipefail
          want=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_whisper }}" = "true" ]; then
            want=1
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            want=1
          fi
          echo "bundle=${want}" >> "${GITHUB_OUTPUT}"
          echo "HIP_BUNDLE_WHISPER=${want}"

      - name: Install cmake (whisper)
        if: steps.whisper.outputs.bundle == '1'
        run: brew install cmake

      - name: Package macOS (.app + .dmg)
        env:
          HIP_SKIP_SIGN: "1"
          HIP_BUNDLE_WHISPER: ${{ steps.whisper.outputs.bundle }}
        run: yarn package:macos

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ci/macos
          APP="src-tauri/target/release/bundle/macos/hip.app"
          if [ ! -d "${APP}" ]; then
            echo "error: missing ${APP}" >&2
            ls -la src-tauri/target/release/bundle/macos/ 2>/dev/null || true
            exit 1
          fi
          # Tar .app so Actions does not flatten the bundle.
          tar -C src-tauri/target/release/bundle/macos -czf dist-ci/macos/hip.app.tar.gz hip.app
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/hip_*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "error: no hip_*.dmg under bundle/dmg" >&2
            ls -la src-tauri/target/release/bundle/dmg/ 2>/dev/null || true
            exit 1
          fi
          cp -v "${dmgs[@]}" dist-ci/macos/
          # Integrity: production sidecar must be inside the app.
          RUNTIME="${APP}/Contents/Resources/hip-sidecar"
          test -f "${RUNTIME}/node"
          test -f "${RUNTIME}/index.js"
          ls -lh dist-ci/macos/
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          echo "triple=${triple:-unknown}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: hip-macos-${{ steps.collect.outputs.triple }}
          path: dist-ci/macos/
          if-no-files-found: error
          retention-days: 1

  package-windows:
    name: package-windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn (classic)
        shell: bash
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: package-windows

      - name: Install yarn deps
        run: yarn install --frozen-lockfile

      - name: Resolve whisper bundling
        id: whisper
        shell: bash
        run: |
          set -euo pipefail
          want=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_whisper }}" = "true" ]; then
            want=1
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            want=1
          fi
          echo "bundle=${want}" >> "${GITHUB_OUTPUT}"
          echo "HIP_BUNDLE_WHISPER=${want}"

      - name: Install cmake (whisper)
        if: steps.whisper.outputs.bundle == '1'
        shell: bash
        run: |
          set -euo pipefail
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          echo "C:/Program Files/CMake/bin" >> "${GITHUB_PATH}"
          cmake --version

      - name: Package Windows (NSIS)
        shell: pwsh
        env:
          HIP_BUNDLE_WHISPER: ${{ steps.whisper.outputs.bundle }}
        run: yarn package:windows

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ci/windows
          NSIS="src-tauri/target/release/bundle/nsis"
          if [ ! -d "${NSIS}" ]; then
            echo "error: missing ${NSIS}" >&2
            ls -la src-tauri/target/release/bundle/ 2>/dev/null || true
            exit 1
          fi
          shopt -s nullglob
          setups=("${NSIS}"/*.exe)
          if [ "${#setups[@]}" -eq 0 ]; then
            echo "error: no NSIS .exe under ${NSIS}" >&2
            ls -la "${NSIS}" || true
            exit 1
          fi
          cp -v "${setups[@]}" dist-ci/windows/
          ls -lh dist-ci/windows/
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          echo "triple=${triple:-unknown}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: hip-windows-${{ steps.collect.outputs.triple }}
          path: dist-ci/windows/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Upload Release Assets
    needs: [package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hip-macos-*
          path: dist-release/macos
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hip-windows-*
          path: dist-release/windows
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== macOS ==="
          ls -lh dist-release/macos/
          echo "=== Windows ==="
          ls -lh dist-release/windows/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/macos/*
            dist-release/windows/*
          fail_on_unmatched_files: true
