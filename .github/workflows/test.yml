name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn workspace @hip/protocol type-check
      - run: yarn workspace @hip/sidecar type-check

  unit-contract:
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  rust-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  e2e-smoke:
    runs-on: macos-latest
    needs: [type-check]
    # Full desktop e2e remains non-blocking until the smoke suite is stable enough
    # to gate merges (see docs/superpowers/plans/2026-07-10-architecture-remediation.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - run: yarn install --frozen-lockfile
      - run: yarn tauri build --debug
      - run: yarn test:e2e
