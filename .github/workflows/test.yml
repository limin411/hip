name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prod sidecar / node:sqlite need >= 22.5; keep CI on a current LTS line.
  NODE_VERSION: "22"

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Enable Yarn (classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn workspace @hip/protocol type-check
      - run: yarn workspace @hip/sidecar type-check
      - run: yarn workspace @hip/cli type-check
      - run: yarn product:content:check

  unit-contract:
    runs-on: ubuntu-latest
    needs: [type-check]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Enable Yarn (classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      # Single run with coverage (avoids running the suite twice).
      - run: yarn test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 1

  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  e2e-smoke:
    runs-on: macos-latest
    needs: [type-check]
    # Full desktop e2e remains non-blocking until the smoke suite is stable enough
    # to gate merges.
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Enable Yarn (classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: yarn install --frozen-lockfile
      # externalBin binaries/ are gitignored — generate the dev sidecar wrapper first.
      - run: yarn sidecar:dev-bin
      - run: yarn tauri build --debug
      - run: yarn test:e2e:smoke
