<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>画布</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #c0c0c0;
    }
    canvas {
      max-width: 95vw;
      max-height: 95vh;
      width: auto;
      height: auto;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
    }
  </style>
  <base target="_blank">
</head>
<body>
<canvas id="canvas" width="1800" height="1100"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 1800, H = 1100;

  // 白色背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 点阵网格
  ctx.fillStyle = '#e0e0e0';
  for (let x = 0; x < W; x += 20) {
    for (let y = 0; y < H; y += 20) {
      ctx.beginPath();
      ctx.arc(x + 10, y + 10, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 圆角矩形函数
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 中间白色主区域（带描边）
  const mx = 50, my = 130, mw = 1700, mh = 840, mr = 40;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, mx, my, mw, mh, mr);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#d0d0d0';
  ctx.stroke();

  // 缝隙
  const gap = 10;
  const pw = 520, pr = 24;
  const ph = mh - gap * 2;

  // 左侧白色面板
  const lx = mx + gap, ly = my + gap;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, lx, ly, pw, ph, pr);
  ctx.fill();
  ctx.restore();

  // MAC 红绿灯
  const dotY = ly + 28;
  const dotR = 7;
  const dotGap = 20;
  const dotX = lx + 24;

  ctx.fillStyle = '#ff5f57';
  ctx.beginPath();
  ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#e0443e';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.fillStyle = '#ffbd2e';
  ctx.beginPath();
  ctx.arc(dotX + dotGap, dotY, dotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d49a24';
  ctx.stroke();

  ctx.fillStyle = '#28c840';
  ctx.beginPath();
  ctx.arc(dotX + dotGap * 2, dotY, dotR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1aab2e';
  ctx.stroke();

  // 侧边栏收缩图标
  const iconX = dotX + dotGap * 3 + 8;
  const iconY = dotY;
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(iconX + 8, iconY - 6);
  ctx.lineTo(iconX, iconY);
  ctx.lineTo(iconX + 8, iconY + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(iconX + 14, iconY - 6);
  ctx.lineTo(iconX + 6, iconY);
  ctx.lineTo(iconX + 14, iconY + 6);
  ctx.stroke();

  // 滑动条
  const segX = lx + 20;
  const segY = ly + 52;
  const segW = pw - 40;
  const segH = 36;
  const segR = 18;
  const btnW = segW / 3;

  ctx.fillStyle = '#f0f0f0';
  roundRect(ctx, segX, segY, segW, segH, segR);
  ctx.fill();

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.08)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, segX + 2, segY + 2, btnW - 4, segH - 4, segR - 2);
  ctx.fill();
  ctx.restore();

  ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('办公', segX + btnW * 0.5, segY + segH * 0.5);
  ctx.fillStyle = '#888888';
  ctx.fillText('编码', segX + btnW * 1.5, segY + segH * 0.5);
  ctx.fillText('领域', segX + btnW * 2.5, segY + segH * 0.5);

  // 新建对话按钮
  const newChatX = lx + 20;
  const newChatY = segY + segH + 16;
  const newChatW = pw - 40;
  const newChatH = 40;
  const newChatR = 20;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.1)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#2a2a2a';
  roundRect(ctx, newChatX, newChatY, newChatW, newChatH, newChatR);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('新建对话', newChatX + newChatW / 2, newChatY + newChatH / 2);

  // 搜索框
  const searchX = lx + 20;
  const searchY = newChatY + newChatH + 12;
  const searchW = pw - 40;
  const searchH = 36;
  const searchR = 18;

  ctx.fillStyle = '#f5f5f5';
  roundRect(ctx, searchX, searchY, searchW, searchH, searchR);
  ctx.fill();

  const searchIconX = searchX + 14;
  const searchIconY = searchY + searchH / 2;
  ctx.strokeStyle = '#aaaaaa';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(searchIconX + 4, searchIconY - 2, 6, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(searchIconX + 8, searchIconY + 3);
  ctx.lineTo(searchIconX + 12, searchIconY + 7);
  ctx.stroke();

  ctx.fillStyle = '#aaaaaa';
  ctx.font = '13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('搜索对话...', searchIconX + 22, searchIconY);

  // ========== 历史对话记录 ==========
  const listX = lx + 20;
  let listY = searchY + searchH + 20;
  const listW = pw - 40;
  const itemH = 52;
  const itemGap = 6;

  function drawChatItem(x, y, w, title, preview, isActive) {
    if (isActive) {
      ctx.fillStyle = '#f0f0f0';
      roundRect(ctx, x, y, w, itemH, 10);
      ctx.fill();
    }
    ctx.fillStyle = isActive ? '#1a1a1a' : '#555555';
    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(title, x + 14, y + 10);
    ctx.fillStyle = '#999999';
    ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillText(preview, x + 14, y + 30);
  }

  function drawGroupTitle(x, y, text) {
    ctx.fillStyle = '#aaaaaa';
    ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(text, x, y);
  }

  drawGroupTitle(listX, listY, '今天');
  listY += 22;
  drawChatItem(listX, listY, listW, '周报模板生成', '帮我写一份周报模板，包含本周...', true);
  listY += itemH + itemGap;
  drawChatItem(listX, listY, listW, '会议记录整理', '请将以下会议内容整理成正式...', false);
  listY += itemH + itemGap;

  listY += 10;
  drawGroupTitle(listX, listY, '昨天');
  listY += 22;
  drawChatItem(listX, listY, listW, '项目计划书撰写', '帮我起草一份项目计划书，需...', false);
  listY += itemH + itemGap;
  drawChatItem(listX, listY, listW, '数据分析报告', '对Q3销售数据进行分析并...', false);
  listY += itemH + itemGap;

  listY += 10;
  drawGroupTitle(listX, listY, '更早');
  listY += 22;
  drawChatItem(listX, listY, listW, '年终总结报告', '撰写2025年度工作总结报告...', false);
  listY += itemH + itemGap;

  const moreY = listY + 8;
  const moreTextX = listX + 14;

  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(moreTextX, moreY);
  ctx.lineTo(moreTextX + 4, moreY + 4);
  ctx.lineTo(moreTextX, moreY + 8);
  ctx.stroke();

  ctx.fillStyle = '#999999';
  ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('查看更多', moreTextX + 12, moreY + 4);

  // ========== 左下角用户中心按钮 ==========
  const userBtnX = lx + 20;
  const userBtnY = ly + ph - 64;
  const userBtnW = pw - 40;
  const userBtnH = 48;
  const userBtnR = 24;

  ctx.fillStyle = '#f5f5f5';
  roundRect(ctx, userBtnX, userBtnY, userBtnW, userBtnH, userBtnR);
  ctx.fill();

  const avatarCX = userBtnX + 28;
  const avatarCY = userBtnY + userBtnH / 2;
  const avatarR = 14;

  const avatarGrad = ctx.createLinearGradient(avatarCX - avatarR, avatarCY - avatarR, avatarCX + avatarR, avatarCY + avatarR);
  avatarGrad.addColorStop(0, '#667eea');
  avatarGrad.addColorStop(1, '#764ba2');
  ctx.fillStyle = avatarGrad;
  ctx.beginPath();
  ctx.arc(avatarCX, avatarCY, avatarR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', avatarCX, avatarCY);

  ctx.fillStyle = '#28c840';
  ctx.beginPath();
  ctx.arc(avatarCX + 10, avatarCY + 10, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Alex Chen', avatarCX + 22, avatarCY - 6);

  ctx.fillStyle = '#888888';
  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('在线', avatarCX + 22, avatarCY + 8);

  const bellX = userBtnX + userBtnW - 52;
  const bellY = userBtnY + userBtnH / 2;
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.arc(bellX, bellY - 3, 5, Math.PI, 0, false);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bellX - 5, bellY - 3);
  ctx.lineTo(bellX - 5, bellY + 3);
  ctx.lineTo(bellX + 5, bellY + 3);
  ctx.lineTo(bellX + 5, bellY - 3);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bellX - 3, bellY + 5);
  ctx.lineTo(bellX + 3, bellY + 5);
  ctx.stroke();

  ctx.fillStyle = '#ff5f57';
  ctx.beginPath();
  ctx.arc(bellX + 4, bellY - 6, 4, 0, Math.PI * 2);
  ctx.fill();

  const arrowX = userBtnX + userBtnW - 20;
  const arrowY = userBtnY + userBtnH / 2;
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(arrowX - 4, arrowY - 2);
  ctx.lineTo(arrowX, arrowY + 2);
  ctx.lineTo(arrowX + 4, arrowY - 2);
  ctx.stroke();

  // 右侧白色面板
  const rx = mx + mw - gap - pw;
  const ry = my + gap;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, rx, ry, pw, ph, pr);
  ctx.fill();
  ctx.restore();

  // ========== 右侧面板 ==========
  const tabY = ry + 20;
  const tabH = 36;
  const tabCenterY = tabY + tabH / 2;

  const collapseIconX = rx + 24;
  ctx.strokeStyle = '#999999';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(collapseIconX - 4, tabCenterY - 6);
  ctx.lineTo(collapseIconX + 4, tabCenterY);
  ctx.lineTo(collapseIconX - 4, tabCenterY + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(collapseIconX + 2, tabCenterY - 6);
  ctx.lineTo(collapseIconX + 10, tabCenterY);
  ctx.lineTo(collapseIconX + 2, tabCenterY + 6);
  ctx.stroke();

  const tabX = rx + 56;
  const tabW = pw - 76;
  const singleTabW = tabW / 4;

  ctx.fillStyle = '#f0f0f0';
  roundRect(ctx, tabX, tabY, tabW, tabH, 18);
  ctx.fill();

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.08)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#ffffff';
  roundRect(ctx, tabX + 2, tabY + 2, singleTabW - 4, tabH - 4, 16);
  ctx.fill();
  ctx.restore();

  ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#1a1a1a';
  ctx.fillText('文件', tabX + singleTabW * 0.5, tabY + tabH / 2);
  ctx.fillStyle = '#888888';
  ctx.fillText('智能体', tabX + singleTabW * 1.5, tabY + tabH / 2);
  ctx.fillText('待定', tabX + singleTabW * 2.5, tabY + tabH / 2);
  ctx.fillText('待定', tabX + singleTabW * 3.5, tabY + tabH / 2);

  // ========== 中间区域：仅保留标题 ==========
  const midX = lx + pw + gap;
  const midY = ly + 20;
  const midW = rx - midX - gap;

  // 标题（居中）
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('周报模板生成', midX + midW / 2, midY);

  // 分隔线
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(midX + 20, midY + 32);
  ctx.lineTo(midX + midW - 20, midY + 32);
  ctx.stroke();
</script>
</body>
</html>
