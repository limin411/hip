<!DOCTYPE html>
<html lang="zh-CN" data-style="flat" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hip 扁平化改造 — 视觉预览</title>
<style>
  /* ============================================================
     页面框架
  ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    color: #333;
    background: #e9e7ef;
    min-width: 720px;
  }
  html[data-theme="dark"] body { background: #14131a; color: #ddd; }

  /* 装饰性背景色块 —— 用于演示「毛玻璃透过」与「实色遮盖」的差异 */
  .page-blob {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(640px 420px at 18% 12%, rgba(194,65,12,.16), transparent 65%),
      radial-gradient(520px 420px at 88% 88%, rgba(124,58,237,.20), transparent 65%),
      radial-gradient(420px 320px at 62% 6%, rgba(26,140,216,.14), transparent 65%);
  }
  html[data-theme="dark"] .page-blob { opacity: .55; }

  /* ============================================================
     Top bar（模式/主题切换）
  ============================================================ */
  .topbar {
    position: relative; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; gap: 16px;
  }
  .topbar h1 { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .topbar .sub { font-size: 12px; color: #888; font-weight: 400; margin-top: 2px; }
  html[data-theme="dark"] .topbar .sub { color: #888; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    background: rgba(255,255,255,.9); color: #444;
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 4px;
    transition: background-color .1s, color .1s, border-color .1s;
  }
  .btn:hover { background: #fff; color: #111; }
  .btn.on { background: #c2410c; color: #fff; border-color: #c2410c; }
  html[data-theme="dark"] .btn { background: rgba(30,29,38,.9); color: #bbb; }
  html[data-theme="dark"] .btn:hover { background: #26252f; color: #fff; }
  html[data-theme="dark"] .btn.on { background: #ffb300; color: #14140f; border-color: #ffb300; }

  /* ============================================================
     窗口通用布局（与真实 AppLayout / AppSidebar / MainToolbar 一致）
     真实结构：AppSidebar | 主列(MainToolbar + [主内容 | 右栏 26% 可拖])
  ============================================================ */
  .stage { position: relative; z-index: 10; display: flex; gap: 28px; justify-content: center; align-items: flex-start; padding: 6px 20px 40px; flex-wrap: wrap; }
  .stage.single { gap: 0; }

  .win {
    width: 1180px; flex: 0 0 auto; height: 700px;
    background: var(--bg-app);
    border-radius: var(--radius-win);
    border: 1px solid var(--border);
    display: flex;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-1);
  }
  .win.win-compact { width: 580px; height: 660px; }
  .win.win-compact .col-right { display: none; }
  .win.win-compact .title-caption { display: none; }
  .win.win-compact .toolbar-extra { display: none; }
  .win.win-compact .side-search-list { display: none; }

  /* —— 左：AppSidebar —— */
  .side {
    width: 264px; flex: 0 0 auto;
    display: flex; flex-direction: column;
    background: var(--bg-sub);
    border-right: 1px solid var(--border);
  }
  /* 侧栏 titlebar 行（与 MainToolbar 同基线；mac 下为红绿灯让位 90px） */
  .side-titlebar {
    display: flex; align-items: center; gap: 2px;
    height: var(--titlebar-h); padding-right: 10px;
    background: var(--bg-title);
  }
  .titlebar-icon-btn {
    width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); background: transparent; border: 0; border-radius: var(--radius-sm);
  }
  .titlebar-icon-btn:hover { background: var(--state-hover); color: var(--text-1); }
  .titlebar-icon-btn:disabled { opacity: .3; pointer-events: none; }
  .titlebar-icon-btn svg { width: 15px; height: 15px; stroke-width: var(--icon-stroke); }
  .lights-inset { width: 90px; height: 100%; flex: 0 0 auto; }

  /* 版本号（侧栏顶部，titlebar 之下） */
  .side-version {
    padding: 0 12px 6px; font-size: 11px; letter-spacing: .04em;
    color: var(--text-3); -webkit-user-select: none; user-select: none;
  }

  /* 导航（会话/项目/知识库/终端/任务/自动化） */
  .side-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 9px; width: 100%;
    border: 0; background: transparent; text-align: left; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-2); border-radius: var(--radius-sm);
  }
  .nav-item:hover { background: var(--state-hover); color: var(--text-1); }
  .nav-item.active { background: var(--state-active); color: var(--text-1); }
  .nav-item .ni-icon { opacity: .7; display: inline-flex; }
  .nav-item.active .ni-icon { opacity: 1; }
  .nav-item svg { width: 16px; height: 16px; stroke-width: var(--icon-stroke); }
  .nav-item .ni-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .ni-count { font-size: 11px; color: var(--text-3); tabular-nums: 1; }

  /* 列表区 */
  .side-list { flex: 1; overflow: hidden; padding: 0 8px 8px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px; }
  .list-head .lh-title { font-size: 11px; font-weight: 500; color: var(--text-3); }
  .list-head .lh-new { font-size: 11px; color: var(--text-3); border: 0; background: transparent; padding: 1px 6px; border-radius: var(--radius-sm); cursor: pointer; }
  .list-head .lh-new:hover { background: var(--state-hover); color: var(--text-1); }
  .group-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 5px 8px; margin-bottom: 2px;
    border: 0; background: transparent; text-align: left; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 500; color: var(--text-2);
    border-radius: var(--radius-sm);
  }
  .group-head:hover { background: var(--state-hover); }
  .group-head svg { width: 12px; height: 12px; stroke-width: var(--icon-stroke); color: var(--text-3); }
  .group-head .gh-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head .gh-count { font-size: 11px; color: var(--text-3); }
  .session {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 26px; margin-bottom: 1px;
    border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 13px; font-weight: 500;
    cursor: default; white-space: nowrap; overflow: hidden;
  }
  .session:hover { background: var(--state-hover); }
  .session.active { background: var(--state-active); color: var(--text-1); }
  .session .run-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .session .s-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sbadge { flex: none; font-size: 11px; border-radius: var(--radius-xs); padding: 0 6px; height: 17px; line-height: 17px; }
  .sbadge.code { background: var(--badge-code-bg); color: var(--badge-code-fg); }
  .sbadge.chat { background: var(--bg-mut); color: var(--text-3); }

  /* 底部：回收站 / 历史 / 设置 */
  .side-footer { border-top: 1px solid var(--border); padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .foot-item {
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 9px; width: 100%;
    border: 0; background: transparent; text-align: left; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--text-2); border-radius: var(--radius-sm);
  }
  .foot-item:hover { background: var(--state-hover); color: var(--text-1); }
  .foot-item svg { width: 16px; height: 16px; stroke-width: var(--icon-stroke); opacity: .7; }
  .foot-item .fi-label { flex: 1; }
  .foot-badge {
    flex: none; font-size: 11px; tabular-nums: 1;
    background: var(--bg-mut); color: var(--text-3);
    border-radius: var(--radius-pill); padding: 0 7px; height: 16px; line-height: 16px;
  }

  /* —— 右：主列 —— */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-content); }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    height: var(--titlebar-h); padding: 0 12px;
    background: var(--bg-title);
    -webkit-user-select: none; user-select: none;
  }
  .toolbar .tb-title {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toolbar-extra { display: flex; align-items: center; gap: 6px; }
  .conn { display: flex; align-items: center; gap: 6px; padding-left: 6px; font-size: 11px; color: var(--text-3); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex: none; }

  .main-body { flex: 1; min-height: 0; display: flex; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 消息列（居中阅读列） */
  .chat-scroll { flex: 1; overflow: hidden; padding: 14px 20px 0; }
  .chat-column { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; height: 100%; }
  .msg-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
  .msg-meta .m-who { color: var(--text-2); font-weight: 500; }
  .bubble-user {
    width: fit-content; max-width: 100%;
    background: var(--bubble-user-bg);
    border: 1px solid var(--bubble-user-border);
    border-radius: var(--radius-bubble-user);
    padding: 7px 12px; margin-top: 2px;
  }
  .agent-block { margin-top: 2px; }
  .prose { font-size: 13px; color: var(--text-1); margin: 4px 0; }
  .prose b { font-weight: 600; }
  .prose code {
    background: var(--bg-mut); border: 1px solid var(--border);
    border-radius: var(--radius-xs); padding: 0 4px; font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .thinking {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg-sub); padding: 6px 9px; font-size: 12px; color: var(--text-3);
    display: flex; gap: 7px; align-items: baseline;
  }
  .thinking .t { font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .codeblock {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden; margin: 6px 0;
  }
  .codeblock .cb-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 9px; font-size: 11px; color: var(--code-head-fg);
    border-bottom: 1px solid var(--border);
  }
  .codeblock pre {
    padding: 8px 10px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.6; color: var(--code-fg); overflow: hidden;
  }
  .codeblock .kw { color: var(--code-kw); } .codeblock .st { color: var(--code-st); } .codeblock .cm { color: var(--code-cm); }
  .todo { margin: 6px 0 2px; display: flex; flex-direction: column; gap: 3px; }
  .todo label { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; color: var(--text-1); }
  .todo input { margin-top: 3px; width: 11px; height: 11px; appearance: none; border: 1.5px solid var(--border-strong); border-radius: var(--radius-xs); background: var(--bg-app); }
  .todo input:checked { background: var(--accent); border-color: var(--accent); }
  .todo input:checked::after { content: "✓"; display: flex; align-items: center; justify-content: center; color: var(--on-accent); font-size: 9px; font-weight: 700; line-height: 1; margin-top: -1px; }
  .todo .done { color: var(--text-3); text-decoration: line-through; }
  .toolcall {
    display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2);
    border: 1px solid var(--border); border-left-width: 3px; border-left-color: var(--success);
    background: var(--bg-sub); border-radius: var(--radius-sm); padding: 4px 9px; margin-top: 4px;
  }
  .toolcall svg { width: 13px; height: 13px; stroke-width: var(--icon-stroke); color: var(--success); }
  .toolcall .tc-name { font-weight: 500; }
  .toolcall .tc-file { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .agent-foot { font-size: 11px; color: var(--text-3); display: flex; gap: 10px; margin-top: 4px; }

  /* Composer（variant=card：rounded-xl border bg-surface-subtle，浮在主列之上） */
  .inputbar { padding: 8px 20px 14px; background: var(--bg-content); }
  .composer {
    max-width: 760px; margin: 0 auto;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg-sub); padding: 10px;
  }
  .comp-main { padding: 2px 6px 6px; font-size: 13px; color: var(--text-3); }
  .comp-foot { display: flex; align-items: center; gap: 4px; padding: 2px; }
  .comp-foot .left { flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0; flex-wrap: wrap; }
  .comp-foot .right { display: flex; align-items: center; gap: 6px; flex: none; }
  .cchip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 28px; padding: 0 8px;
    font: inherit; font-size: 12px; font-weight: 500; color: var(--text-1);
    background: var(--bg-mut); border: 0; border-radius: var(--radius-sm);
    cursor: pointer; white-space: nowrap;
  }
  .cchip:hover { background: var(--state-active); }
  .cchip .cc-chev { color: var(--text-3); display: inline-flex; }
  .cchip svg { width: 12px; height: 12px; stroke-width: var(--icon-stroke); }
  .cc-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; color: var(--text-2); background: transparent;
    border: 0; border-radius: var(--radius-sm); cursor: pointer;
  }
  .cc-ghost:hover { background: var(--state-hover); }
  .cc-ghost svg { width: 14px; height: 14px; stroke-width: var(--icon-stroke); }
  /* Effort chip：名称 + 5 根竖条强度表（EffortIntensityMeter） */
  .effort .ticks { display: flex; align-items: flex-end; gap: 1px; margin-left: 2px; }
  .effort .tick { width: 2.5px; border-radius: 1px; transition: background-color .1s; }
  .effort .tick.h-1 { height: 4px; } .effort .tick.h-2 { height: 6px; } .effort .tick.h-3 { height: 8px; } .effort .tick.h-4 { height: 10px; }
  .effort .tick.on { background: var(--ink); }
  .effort .tick.off { background: var(--tick-off); }
  .effort.max .tick.on { background: var(--tick-max); }
  .effort.max .tick.h-4 { background: var(--tick-max-top); box-shadow: var(--tick-max-glow); }
  .send {
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; cursor: pointer; color: var(--on-accent); background: var(--accent);
    border-radius: var(--radius-send);
  }
  .send:hover { background: var(--accent-hover); }
  .send svg { width: 15px; height: 15px; stroke-width: 1.75; }
  .tokens { font-size: 11px; color: var(--text-3); padding: 0 4px; }

  /* —— 右栏（26% 可拖抽屉）—— */
  .col-right {
    width: 300px; flex: 0 0 auto;
    display: flex; flex-direction: column;
    background: var(--bg-sub);
    border-left: 1px solid var(--border);
  }
  .panel-tabbar {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 6px 10px; min-height: 38px;
  }
  .panel-tab {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 8px;
    font: inherit; font-size: 12px; font-weight: 500; color: var(--text-1);
    border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer;
  }
  .panel-tab:hover { background: var(--state-hover); }
  .panel-tab svg { width: 13px; height: 13px; stroke-width: var(--icon-stroke); color: var(--text-3); }
  .right-body { flex: 1; overflow: hidden; padding: 8px 12px; }
  .file-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding: 2px 0; }
  .file-row .fi {
    width: 12px; height: 12px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; border-radius: var(--radius-xs); color: #fff;
  }
  .file-row .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .file-row.mut .fi { background: var(--role-coder); }
  .file-row.add .fi { background: var(--success); }
  .diff { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.6; }
  .diff .d-head { padding: 4px 8px; font-size: 10.5px; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--bg-mut); }
  .diff .d-line { padding: 0 8px; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .diff .d-add { background: var(--diff-add-bg); color: var(--diff-add-fg); }
  .diff .d-del { background: var(--diff-del-bg); color: var(--diff-del-fg); }

  /* ============================================================
     皮肤变量 —— 当前（毛玻璃 + 阴影 + 全息）
  ============================================================ */
  .skin-current {
    --bg-app: #ffffff;
    --bg-sub: rgba(255,255,255,.78);
    --bg-mut: #f2f2f2;
    --bg-content: #ffffff;
    --bg-title: rgba(255,255,255,.78);
    --border: #bdbdbd;
    --border-strong: #a0a0a0;
    --text-1: #111111; --text-2: #5e5e5e; --text-3: #757575;
    --accent: #c2410c; --accent-hover: #9a3412; --on-accent: #fff;
    --state-hover: #f0f0f0; --state-active: #e6e6e6;
    --success: #3d9a50; --danger: #c63b3b;
    --role-coder: #3d9a50;
    --badge-code-bg: rgba(61,154,80,.12); --badge-code-fg: #2f7d40;
    --effort: #7c3aed;
    --radius-xs: 4px; --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-win: 12px;
    --radius-pill: 999px; --radius-send: 999px;
    --radius-bubble-user: 12px;
    --titlebar-h: 40px;
    --icon-stroke: 1.75;
    --bubble-user-bg: #f5f5f5; --bubble-user-border: transparent;
    --code-bg: #1e1e22; --code-fg: #d6d6da; --code-head-fg: #9a9aa4; --code-kw: #c792ea; --code-st: #82aaff; --code-cm: #5c6370;
    --diff-add-bg: rgba(61,154,80,.10); --diff-add-fg: #2f7d40;
    --diff-del-bg: rgba(198,59,59,.10); --diff-del-fg: #b33a3a;
    --tick-off: rgba(17,17,17,.15);
    --tick-max: #a855f7; --tick-max-top: #a855f7;
    --tick-max-glow: 0 0 4px rgba(168,85,247,.55);
    --ink: #111111;
  }
  html[data-theme="dark"] .skin-current {
    --bg-app: #0f0f0f;
    --bg-sub: rgba(23,23,23,.86);
    --bg-mut: #222222;
    --bg-content: #0f0f0f;
    --bg-title: rgba(23,23,23,.86);
    --border: #3a3a3a; --border-strong: #4a4a4a;
    --text-1: #f0f0f0; --text-2: #a3a3a3; --text-3: #7a7a7a;
    --accent: #ffb300; --accent-hover: #ffb300; --on-accent: #111;
    --state-hover: #222222; --state-active: #2e2e2e;
    --success: #4caf50;
    --role-coder: #5dc96c;
    --badge-code-bg: rgba(93,201,108,.16); --badge-code-fg: #5dc96c;
    --effort: #c4b5fd;
    --bubble-user-bg: #1b1b1b; --bubble-user-border: transparent;
    --code-bg: #16161a; --code-fg: #c9c9cf; --code-head-fg: #7e7e88; --code-kw: #c792ea; --code-st: #82aaff; --code-cm: #5c6370;
    --diff-add-bg: rgba(76,175,80,.14); --diff-add-fg: #4caf50;
    --diff-del-bg: rgba(255,82,82,.12); --diff-del-fg: #ff8a8a;
    --tick-off: rgba(240,240,240,.18);
    --tick-max: #c4b5fd; --tick-max-top: #e9d5ff;
    --tick-max-glow: 0 0 6px rgba(196,181,253,.55);
    --ink: #f0f0f0;
  }

  /* ============================================================
     皮肤变量 —— 扁平（实色 + 边框 + 纯色）
  ============================================================ */
  .skin-flat {
    --bg-app: #ffffff;
    --bg-sub: #fafafa;
    --bg-mut: #f1f1f1;
    --bg-content: #ffffff;
    --bg-title: #fafafa;

const stage = document.getElementById('stage');
function render() {
  const style = document.documentElement.dataset.style;
  const view = document.documentElement.dataset.view;
  stage.className = 'stage ' + (view === 'split' ? '' : 'single');
  if (view === 'split') {
    stage.innerHTML = `
      <div style="display:flex;flex-direction:column">
        <div data-w="current" class="win-holder skin-current"></div>
        <div class="caption">当前风格</div>
      </div>

        <div data-w="flat" class="win-holder skin-flat"></div>
        <div class="caption">扁平风格</div>
      </div>`;
    stage.querySelector('[data-w="current"]').innerHTML = windowHTML(true);
    stage.querySelector('[data-w="flat"]').innerHTML = windowHTML(true);
  } else {
    stage.innerHTML = `<div data-w="${style}" class="win-holder skin-${style}"></div>`;
    stage.querySelector('[data-w]').innerHTML = windowHTML(false);
  }
}

/* 控件 */
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  document.documentElement.dataset.view = b.dataset.view;
  document.documentElement.dataset.style = b.dataset.view === 'current' ? 'current' : (b.dataset.view === 'flat' ? 'flat' : document.documentElement.dataset.style);
  render();
}));
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {

}));
