<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">hip Mascot Logo (Animated)</title>
  <desc id="desc">A cute flat mascot of a smiling peach/butt character with eyes, noodle-line arms, and white glove fists — with blinking and waving animations.</desc>

  <!-- Body group with breathing animation -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"/>

    <!-- Body: two cheeks -->
    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>

    <!-- Center crease -->
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <!-- Left eye with blink -->
    <g>
      <!-- White sclera -->
      <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4">
        <animate attributeName="ry" values="23;23;2;23;23" dur="4s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </ellipse>
      <!-- Pupil -->
      <circle cx="170" cy="157" r="10" fill="#000000">
        <animate attributeName="r" values="10;10;0;10;10" dur="4s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </circle>
      <!-- Highlight -->
      <circle cx="174" cy="152" r="3.5" fill="#FFFFFF">
        <animate attributeName="r" values="3.5;3.5;0;3.5;3.5" dur="4s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </circle>
    </g>

    <!-- Right eye with blink (slightly delayed) -->
    <g>
      <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4">
        <animate attributeName="ry" values="23;23;2;23;23" dur="4s" begin="0.1s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </ellipse>
      <circle cx="238" cy="157" r="10" fill="#000000">
        <animate attributeName="r" values="10;10;0;10;10" dur="4s" begin="0.1s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </circle>
      <circle cx="242" cy="152" r="3.5" fill="#FFFFFF">
        <animate attributeName="r" values="3.5;3.5;0;3.5;3.5" dur="4s" begin="0.1s" repeatCount="indefinite" keyTimes="0;0.42;0.46;0.50;1" calcMode="spline" keySplines="0 0 1 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0 0 1 1"/>
      </circle>
    </g>

    <!-- Smile -->
    <path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

    <!-- Left arm: wave animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 78 230; -15 78 230; 15 78 230; -15 78 230; 0 78 230" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <path d="M78 230 Q48 210 42 178" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <circle cx="40" cy="162" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M30 156 Q40 150 50 156" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Right arm: gentle idle sway -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 322 230; 8 322 230; 0 322 230; -8 322 230; 0 322 230" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <path d="M322 230 Q352 210 358 178" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <circle cx="360" cy="162" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M350 156 Q360 150 370 156" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
