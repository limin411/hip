<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">Flat Butt Mascot Logo</title>
  <desc id="desc">A cute flat mascot of a smiling peach/butt character with eyes, noodle-line arms, and white glove fists.</desc>

  <!-- Body: two cheeks -->
  <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
  <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>

  <!-- Center crease -->
  <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

  <!-- Eyes: white sclera + black pupils (lively, looking slightly up) -->
  <!-- Left eye -->
  <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  <circle cx="170" cy="157" r="10" fill="#000000"/>
  <circle cx="174" cy="152" r="3.5" fill="#FFFFFF"/>
  <!-- Right eye -->
  <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  <circle cx="238" cy="157" r="10" fill="#000000"/>
  <circle cx="242" cy="152" r="3.5" fill="#FFFFFF"/>

  <!-- Smile — near bottom of body -->
  <path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- Left arm: thick black noodle line + white glove fist -->
  <path d="M78 230 Q48 210 42 178" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <circle cx="40" cy="162" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <!-- fist knuckle hint -->
  <path d="M30 156 Q40 150 50 156" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right arm: thick black noodle line + white glove fist -->
  <path d="M322 230 Q352 210 358 178" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <circle cx="360" cy="162" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <path d="M350 156 Q360 150 370 156" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>

</svg>
