    <circle cx="162" cy="1020" r="68"/>
    <circle cx="1110" cy="1020" r="68"/>
    <!-- Antennae stems -->
    <line x1="428" y1="240" x2="362" y2="165" stroke="#9faf8b" stroke-width="40" stroke-linecap="round"/>
    <line x1="844" y1="240" x2="910" y2="165" stroke="#9faf8b" stroke-width="40" stroke-linecap="round"/>
