<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="cry-title cry-desc" style="overflow:visible">
  <title id="cry-title">哭泣</title>
  <desc id="cry-desc">Crying tears</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: sob 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .tear-l { animation: tear 1.3s cubic-bezier(0.33, 0, 0.2, 1) infinite; }
    .tear-r { animation: tear 1.3s cubic-bezier(0.33, 0, 0.2, 1) 0.4s infinite; }
    @keyframes sob {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-2.5px); } 75% { transform: translateX(2.5px); }
    }
    @keyframes tear {
      0% { opacity: 0.95; transform: translateY(0); }
      70% { opacity: 0.85; transform: translateY(16px); }
      100% { opacity: 0; transform: translateY(26px); }
    }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M85 238 Q68 280 52 322" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="52" cy="322" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M42 316 Q52 310 62 316" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M315 238 Q332 280 348 322" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="348" cy="322" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M338 316 Q348 310 358 316" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="164" rx="18" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="167" cy="170" r="8" fill="#000000"/>
    <ellipse cx="234" cy="164" rx="18" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="235" cy="170" r="8" fill="#000000"/>
    <ellipse class="tear-l" cx="166" cy="198" rx="6" ry="10" fill="#78BEFF" stroke="#000000" stroke-width="2"/>
    <ellipse class="tear-r" cx="234" cy="198" rx="6" ry="10" fill="#78BEFF" stroke="#000000" stroke-width="2"/>
<path d="M176 285 Q200 270 224 285" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>
