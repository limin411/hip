<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="angry-title angry-desc" style="overflow:visible">
  <title id="angry-title">生气</title>
  <desc id="angry-desc">Angry fists</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: shake 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 70px 220px; animation: punchL 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: punchR 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    @keyframes punchL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes punchR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }

.pan{animation:an .65s cubic-bezier(0.34, 1.35, 0.64, 1) infinite;transform-origin:0 0}@keyframes an{0%,100%{transform:scale(1)}50%{transform:scale(1.15) rotate(-6deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M78 240 Q56 214 34 188" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="34" cy="188" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M24 182 Q34 176 44 182" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M322 240 Q344 214 366 188" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="366" cy="188" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M356 182 Q366 176 376 182" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 140 L184 150" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M252 150 L216 140" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="166" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="166" r="9" fill="#000000"/>
    <ellipse cx="234" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="166" r="9" fill="#000000"/>
<path d="M176 285 Q200 270 224 285" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(312 100)"><g class="pan"><path d="M-12-12L12 12M12-12L-12 12" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></g></g>
</svg>
