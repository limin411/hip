<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="shock-title shock-desc" style="overflow:hidden">
  <title id="shock-title">惊讶</title>
  <desc id="shock-desc">Shocked</desc>
  <style>

    .root { transform-origin: 200px 220px; animation: pop 1.15s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    @keyframes pop {
      0%,100% { transform: scale(1); } 25% { transform: scale(0.96); }
      55% { transform: scale(1.06); } 75% { transform: scale(0.99); }
    }

.pe{animation:be .7s cubic-bezier(0.34, 1.35, 0.64, 1) infinite}@keyframes be{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M75 235 Q52 252 28 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="28" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M18 262 Q28 256 38 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M325 235 Q348 252 372 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="372" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M362 262 Q372 256 382 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="158" r="10" fill="#000000"/><circle cx="172" cy="151" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="158" r="10" fill="#000000"/><circle cx="240" cy="151" r="3.5" fill="#FFFFFF"/>
<ellipse cx="200" cy="278" rx="16" ry="20" fill="#000000"/><ellipse cx="200" cy="275" rx="9" ry="7" fill="#5A2A2A"/>
  </g>

  <g transform="translate(312 90)"><g class="pe"><circle r="18" fill="#FFD23A" stroke="#000" stroke-width="4"/><text x="0" y="8" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">!</text></g></g>
</svg>
