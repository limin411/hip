<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="laugh-title laugh-desc" style="overflow:hidden">
  <title id="laugh-title">大笑</title>
  <desc id="laugh-desc">Laughing</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: clapBody 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 120px 180px; animation: clapL 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 280px 180px; animation: clapR 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes clapBody { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @keyframes clapL { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-6deg); } }
    @keyframes clapR { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(6deg); } }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M90 230 Q128 175 165 120" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="165" cy="120" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M155 114 Q165 108 175 114" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M310 230 Q272 175 235 120" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="235" cy="120" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M225 114 Q235 108 245 114" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 160 Q234 148 252 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

    <path d="M170 265 Q200 255 230 265 Q200 295 170 265Z" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <path d="M185 268 L185 280 M200 266 L200 282 M215 268 L215 280" stroke="#000000" stroke-width="2"/>
  </g>

</svg>
