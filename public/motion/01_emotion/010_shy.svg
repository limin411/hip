<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="shy-title shy-desc" style="overflow:visible">
  <title id="shy-title">害羞</title>
  <desc id="shy-desc">Shy cover face</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }


    .ph1 { animation: pfloat 1.8s cubic-bezier(0.33, 0, 0.2, 1) 0s infinite; }
    @keyframes pfloat {
      0% { opacity: 0; transform: translateY(6px) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-36px) scale(1.1); }
    }
    .ph2 { animation: pfloat 1.8s cubic-bezier(0.33, 0, 0.2, 1) 0.4s infinite; }
    @keyframes pfloat {
      0% { opacity: 0; transform: translateY(6px) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-36px) scale(1.1); }
    }
    .ph3 { animation: pfloat 1.8s cubic-bezier(0.33, 0, 0.2, 1) 0.85s infinite; }
    @keyframes pfloat {
      0% { opacity: 0; transform: translateY(6px) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-36px) scale(1.1); }
    }
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="168" r="10" fill="#000000"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="168" r="10" fill="#000000"/>
<path d="M188 282 Q200 292 212 282" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M90 230 Q122 199 155 168" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="155" cy="168" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M145 162 Q155 156 165 162" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M310 230 Q278 199 245 168" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="245" cy="168" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M235 162 Q245 156 255 162" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
  </g>

  <g transform="translate(88 100)"><g class="ph1"><path fill="#FF5A6E" d="M0-8C-6-16-16-12-16-2C-16 8 0 18 0 18C0 18 16 8 16-2C16-12 6-16 0-8Z"/></g></g>
  <g transform="translate(312 88)"><g class="ph2"><path fill="#FF5A6E" d="M0-8C-6-16-16-12-16-2C-16 8 0 18 0 18C0 18 16 8 16-2C16-12 6-16 0-8Z" transform="scale(.85)"/></g></g>
  <g transform="translate(200 62)"><g class="ph3"><path fill="#FF7A8C" d="M0-8C-6-16-16-12-16-2C-16 8 0 18 0 18C0 18 16 8 16-2C16-12 6-16 0-8Z" transform="scale(.7)"/></g></g>
</svg>
