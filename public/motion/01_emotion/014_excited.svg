<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="excited-title excited-desc" style="overflow:visible">
  <title id="excited-title">兴奋</title>
  <desc id="excited-desc">Excited</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: wiggle 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-3deg); } 25% { transform: rotate(3.5deg); }
      50% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); }
    }

.ps1{animation:tw 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite}.ps2{animation:tw 1.2s cubic-bezier(0.45, 0, 0.55, 1) .4s infinite}@keyframes tw{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M75 220 Q58 160 40 100" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="40" cy="100" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M30 94 Q40 88 50 94" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M325 220 Q342 160 360 100" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="360" cy="100" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M350 94 Q360 88 370 94" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="158" r="10" fill="#000000"/><circle cx="172" cy="151" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="158" r="10" fill="#000000"/><circle cx="240" cy="151" r="3.5" fill="#FFFFFF"/>
<path d="M168 255 Q200 300 232 255" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(80 90)"><g class="ps1"><path fill="#FFD23A" d="M0-10L3-3L10-3L4 2L6 10L0 5L-6 10L-4 2L-10-3L-3-3Z"/></g></g>
  <g transform="translate(320 85)"><g class="ps2"><path fill="#FFD23A" d="M0-10L3-3L10-3L4 2L6 10L0 5L-6 10L-4 2L-10-3L-3-3Z"/></g></g>
