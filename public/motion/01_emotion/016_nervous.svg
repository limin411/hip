<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="nervous-title nervous-desc" style="overflow:hidden">
  <title id="nervous-title">紧张</title>
  <desc id="nervous-desc">Nervous</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: shake 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 70px 220px; animation: punchL 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: punchR 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    @keyframes punchL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes punchR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }

.psw{animation:sw 1.4s cubic-bezier(0.33, 0, 0.2, 1) infinite}@keyframes sw{0%{opacity:1;transform:translate(0,0)}70%{opacity:.9;transform:translate(3px,12px)}100%{opacity:0;transform:translate(5px,20px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 240 Q122 245 150 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="150" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M140 244 Q150 238 160 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 240 Q278 245 250 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="250" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M240 244 Q250 238 260 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="158" r="10" fill="#000000"/><circle cx="172" cy="151" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="158" r="10" fill="#000000"/><circle cx="240" cy="151" r="3.5" fill="#FFFFFF"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(292 115)"><g class="psw"><ellipse rx="8" ry="12" fill="#78BEFF" stroke="#000" stroke-width="2.5"/></g></g>
</svg>
