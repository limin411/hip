<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="drool-title drool-desc" style="overflow:hidden">
  <title id="drool-title">流口水</title>
  <desc id="drool-desc">Drooling</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 240 Q122 245 150 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="150" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M140 244 Q150 238 160 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 240 Q278 245 250 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="250" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M240 244 Q250 238 260 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="168" r="10" fill="#000000"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="168" r="10" fill="#000000"/>

    <path d="M176 275 Q200 288 224 275" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="218" cy="295" rx="5" ry="8" fill="#78BEFF" stroke="#000000" stroke-width="2"/>
  </g>

</svg>
