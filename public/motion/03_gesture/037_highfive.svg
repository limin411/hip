<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="highfive-title highfive-desc" style="overflow:hidden">
  <title id="highfive-title">击掌</title>
  <desc id="highfive-desc">High five</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: jump 1.05s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .arm-l { transform-origin: 80px 230px; animation: raiseL 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 320px 230px; animation: raiseR 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes jump {
      0%,100% { transform: translateY(0) scale(1,1); }
      12% { transform: translateY(3px) scale(1.04,0.94); }
      40% { transform: translateY(-14px) scale(0.97,1.04); }
      65% { transform: translateY(0) scale(1.03,0.97); }
    }
    @keyframes raiseL { 0%,100% { transform: rotate(-4deg); } 40% { transform: rotate(-16deg); } }
    @keyframes raiseR { 0%,100% { transform: rotate(4deg); } 40% { transform: rotate(16deg); } }

.ps { animation: sp 1.4s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; transform-origin:0 0; }@keyframes sp { 0%,40%,100%{opacity:0;transform:scale(.6)} 55%,70%{opacity:1;transform:scale(1)} }
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M85 230 Q68 209 52 188" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="52" cy="188" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M42 182 Q52 176 62 182" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M315 230 Q335 184 355 138" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="355" cy="138" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M345 132 Q355 126 365 132" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="157" r="10" fill="#000000"/><circle cx="174" cy="152" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="157" r="10" fill="#000000"/><circle cx="242" cy="152" r="3.5" fill="#FFFFFF"/>
<path d="M168 255 Q200 300 232 255" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(305 110)"><g class="ps"><path d="M0-12L0 12M-12 0L12 0M-8-8L8 8M-8 8L8-8" stroke="#000" stroke-width="3.5" stroke-linecap="round"/></g></g>
</svg>
