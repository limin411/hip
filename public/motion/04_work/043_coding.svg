<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="coding-title coding-desc" style="overflow:hidden">
  <title id="coding-title">写代码</title>
  <desc id="coding-desc">Coding</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: nod 1.35s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes nod {
      0%,100% { transform: rotate(0); } 30% { transform: rotate(5deg); }
      55% { transform: rotate(-2deg); } 75% { transform: rotate(3deg); }
    }

.pcur{animation:cur 1.1s step-end infinite}@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 245 Q120 258 145 270" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="145" cy="270" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M135 264 Q145 258 155 264" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 245 Q280 258 255 270" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="255" cy="270" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M245 264 Q255 258 265 264" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="168" r="10" fill="#000000"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="168" r="10" fill="#000000"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 70)">
    <rect x="-55" y="-6" width="110" height="38" rx="6" fill="#2C3E50" stroke="#000" stroke-width="3"/>
    <text x="-42" y="18" font-family="Menlo,Consolas,monospace" font-size="15" fill="#78DC78">&lt;/&gt;</text>
    <rect class="pcur" x="22" y="8" width="8" height="14" fill="#FFD23A"/>
  </g>
</svg>
