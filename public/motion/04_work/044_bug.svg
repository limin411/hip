<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="bug-title bug-desc" style="overflow:visible">
  <title id="bug-title">有 Bug</title>
  <desc id="bug-desc">Found a bug</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: shake 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 70px 220px; animation: punchL 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: punchR 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    @keyframes punchL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes punchR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }

.pbg{animation:bg .5s cubic-bezier(0.22, 0.9, 0.3, 1) infinite}@keyframes bg{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M75 235 Q52 252 28 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="28" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M18 262 Q28 256 38 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M325 235 Q348 252 372 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="372" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M362 262 Q372 256 382 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="158" r="10" fill="#000000"/><circle cx="172" cy="151" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="158" r="10" fill="#000000"/><circle cx="240" cy="151" r="3.5" fill="#FFFFFF"/>
<ellipse cx="200" cy="278" rx="16" ry="20" fill="#000000"/><ellipse cx="200" cy="275" rx="9" ry="7" fill="#5A2A2A"/>
  </g>

  <g transform="translate(310 95)"><g class="pbg">
    <ellipse rx="14" ry="10" fill="#78DC78" stroke="#000" stroke-width="3"/>
    <circle cx="-8" cy="-8" r="6" fill="#78DC78" stroke="#000" stroke-width="2.5"/>
    <path d="M-14-12L-20-18M-6-14L-4-22" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  </g></g>
</svg>
