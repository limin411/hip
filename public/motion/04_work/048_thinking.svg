<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="thinking-title thinking-desc" style="overflow:visible">
  <title id="thinking-title">思考</title>
  <desc id="thinking-desc">Thinking</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }

.pq{animation:bq 1s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes bq{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M85 230 Q68 209 52 188" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="52" cy="188" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M42 182 Q52 176 62 182" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M315 230 Q335 184 355 138" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="355" cy="138" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M345 132 Q355 126 365 132" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="150" r="10" fill="#000000"/><circle cx="174" cy="145" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="150" r="10" fill="#000000"/><circle cx="242" cy="145" r="3.5" fill="#FFFFFF"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(312 90)"><g class="pq"><circle r="18" fill="#FFF" stroke="#000" stroke-width="4"/><text x="0" y="7" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">?</text></g></g>
</svg>
