      55% { transform: scale(1.06); } 75% { transform: scale(0.99); }
    }

.pbu{animation:bu 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes bu{0%,100%{opacity:.75}50%{opacity:1}}
  </style>
