<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="coffee-work-title coffee-work-desc" style="overflow:visible">
  <title id="coffee-work-title">咖啡续命</title>
  <desc id="coffee-work-desc">Work coffee</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: nod 1.35s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes nod {
      0%,100% { transform: rotate(0); } 30% { transform: rotate(5deg); }
      55% { transform: rotate(-2deg); } 75% { transform: rotate(3deg); }
    }

.pcs{animation:cs 1s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes cs{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
  </style>
  <g class="root">

