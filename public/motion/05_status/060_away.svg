<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="away-title away-desc" style="overflow:visible">
  <title id="away-title">离开</title>
  <desc id="away-desc">Away</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 230 Q62 175 40 120" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="40" cy="120" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M30 114 Q40 108 50 114" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M315 238 Q330 269 345 300" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="345" cy="300" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M335 294 Q345 288 355 294" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="176" cy="157" r="10" fill="#000000"/><circle cx="180" cy="152" r="3" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="244" cy="157" r="10" fill="#000000"/><circle cx="248" cy="152" r="3" fill="#FFFFFF"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>
