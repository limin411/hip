<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="done-title done-desc" style="overflow:hidden">
  <title id="done-title">搞定</title>
  <desc id="done-desc">Done</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: jump 1.05s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .arm-l { transform-origin: 80px 230px; animation: raiseL 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 320px 230px; animation: raiseR 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes jump {
      0%,100% { transform: translateY(0) scale(1,1); }
      12% { transform: translateY(3px) scale(1.04,0.94); }
      40% { transform: translateY(-14px) scale(0.97,1.04); }
      65% { transform: translateY(0) scale(1.03,0.97); }
    }
    @keyframes raiseL { 0%,100% { transform: rotate(-4deg); } 40% { transform: rotate(-16deg); } }
    @keyframes raiseR { 0%,100% { transform: rotate(4deg); } 40% { transform: rotate(16deg); } }

.pok{animation:ok 1s cubic-bezier(0.34, 1.35, 0.64, 1) infinite}@keyframes ok{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 238 Q72 269 58 300" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="58" cy="300" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M48 294 Q58 288 68 294" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M315 230 Q340 200 348 160" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <circle cx="348" cy="145" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M348 128 L348 108" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
      <circle cx="348" cy="105" r="6" fill="#000000"/>
    </g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 160 Q234 148 252 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
<path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(310 95)"><g class="pok"><circle r="20" fill="#78DC78" stroke="#000" stroke-width="4"/><path d="M-8 0L-2 8L10-8" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
