<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="wait-title wait-desc" style="overflow:hidden">
  <title id="wait-title">等等</title>
  <desc id="wait-desc">Wait</desc>
  <style>

    .root { transform-origin: 200px 220px; animation: pulse 1.35s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.pld{animation:ld 1s linear infinite;transform-origin:0 0}@keyframes ld{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M78 230 Q50 210 40 190" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="36" cy="175" rx="14" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="5" transform="rotate(-20 36 175)"/>
    </g>
    <g class="arm-r">
      <path d="M322 230 Q350 210 360 190" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="364" cy="175" rx="14" ry="22" fill="#FFFFFF" stroke="#000000" stroke-width="5" transform="rotate(20 364 175)"/>
    </g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="157" r="10" fill="#000000"/><circle cx="174" cy="152" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="157" r="10" fill="#000000"/><circle cx="242" cy="152" r="3.5" fill="#FFFFFF"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 72)"><g class="pld"><circle r="18" fill="none" stroke="#DDD" stroke-width="5"/><path d="M18 0A18 18 0 0 1 0-18" fill="none" stroke="#FF9800" stroke-width="5" stroke-linecap="round"/></g></g>
</svg>
