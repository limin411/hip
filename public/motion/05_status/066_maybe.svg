<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="maybe-title maybe-desc" style="overflow:hidden">
  <title id="maybe-title">再说</title>
  <desc id="maybe-desc">Maybe</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }

.pq{animation:bq 1s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes bq{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M78 230 Q58 239 38 248" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="38" cy="248" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M28 242 Q38 236 48 242" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M322 230 Q342 239 362 248" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="362" cy="248" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M352 242 Q362 236 372 242" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="176" cy="157" r="10" fill="#000000"/><circle cx="180" cy="152" r="3" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="244" cy="157" r="10" fill="#000000"/><circle cx="248" cy="152" r="3" fill="#FFFFFF"/>
<path d="M188 282 Q200 292 212 282" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(312 90)"><g class="pq"><circle r="18" fill="#FFF" stroke="#000" stroke-width="4"/><text x="0" y="7" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">?</text></g></g>
</svg>
