<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="eat-title eat-desc" style="overflow:visible">
  <title id="eat-title">干饭</title>
  <desc id="eat-desc">Eating</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: wiggle 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-3deg); } 25% { transform: rotate(3.5deg); }
      50% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); }
    }

.ppi{animation:pi 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;transform-origin:0 12px}@keyframes pi{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 240 Q122 245 150 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="150" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M140 244 Q150 238 160 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 240 Q278 245 250 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="250" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M240 244 Q250 238 260 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 160 Q234 148 252 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
<path d="M168 255 Q200 300 232 255" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 72)"><g class="ppi">
    <path d="M0-5L28 35L-28 35Z" fill="#FFD23A" stroke="#000" stroke-width="3"/>
    <circle cx="-6" cy="18" r="4" fill="#FF5A6E"/><circle cx="8" cy="22" r="3.5" fill="#FF5A6E"/>
  </g></g>
</svg>
