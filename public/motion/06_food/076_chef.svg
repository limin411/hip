<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="chef-title chef-desc" style="overflow:visible">
  <title id="chef-title">大厨</title>
  <desc id="chef-desc">Chef</desc>
  <style>

    .root { transform-origin: 200px 290px; animation: bob 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: thumbs 1.5s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes thumbs { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg) translateY(-4px); } }

.ppi{animation:pi 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite;transform-origin:0 12px}@keyframes pi{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M85 230 Q68 209 52 188" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="52" cy="188" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M42 182 Q52 176 62 182" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M315 230 Q335 184 355 138" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="355" cy="138" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M345 132 Q355 126 365 132" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="157" r="10" fill="#000000"/><circle cx="242" cy="152" r="3.5" fill="#FFFFFF"/>
<path d="M188 272 Q210 290 232 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 72)"><g class="ppi">
    <path d="M0-5L28 35L-28 35Z" fill="#FFD23A" stroke="#000" stroke-width="3"/>
    <circle cx="-6" cy="18" r="4" fill="#FF5A6E"/><circle cx="8" cy="22" r="3.5" fill="#FF5A6E"/>
  </g></g>
</svg>
