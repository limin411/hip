<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="windy-title windy-desc" style="overflow:visible">
  <title id="windy-title">刮风</title>
  <desc id="windy-desc">Windy</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: wiggle 0.7s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-3deg); } 25% { transform: rotate(3.5deg); }
      50% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); }
    }

.pml{animation:ml .42s cubic-bezier(0.22, 0.9, 0.3, 1) infinite}@keyframes ml{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.9;transform:translateX(-6px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M75 235 Q52 252 28 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="28" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M18 262 Q28 256 38 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M325 235 Q348 252 372 268" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="372" cy="268" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M362 262 Q372 256 382 262" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="160" cy="157" r="10" fill="#000000"/><circle cx="156" cy="152" r="3" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="228" cy="157" r="10" fill="#000000"/><circle cx="224" cy="152" r="3" fill="#FFFFFF"/>
<ellipse cx="200" cy="278" rx="12" ry="14" fill="none" stroke="#000000" stroke-width="6"/>
  </g>

  <g class="pml" stroke="#000" stroke-width="4" stroke-linecap="round" opacity=".6">
    <line x1="48" y1="160" x2="28" y2="160"/><line x1="52" y1="185" x2="30" y2="185"/><line x1="50" y1="210" x2="32" y2="210"/>
  </g>
</svg>
