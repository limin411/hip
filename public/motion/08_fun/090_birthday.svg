<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="birthday-title birthday-desc" style="overflow:hidden">
  <title id="birthday-title">生日快乐</title>
  <desc id="birthday-desc">Birthday</desc>
  <style>

    .root { transform-origin: 200px 290px; animation: bounce 1.25s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .arm-l { transform-origin: 60px 220px; animation: waveL 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 340px 220px; animation: waveR 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes bounce {
      0%,100% { transform: translateY(0) scale(1,1); }
      30% { transform: translateY(-9px) scale(0.98,1.03); }
      55% { transform: translateY(0) scale(1.03,0.97); }
      75% { transform: translateY(-3px) scale(0.995,1.01); }
    }
    @keyframes waveL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes waveR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }

.pgi{animation:gi 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes gi{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 240 Q122 245 150 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="150" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M140 244 Q150 238 160 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 240 Q278 245 250 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="250" cy="250" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M240 244 Q250 238 260 244" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="158" r="10" fill="#000000"/><circle cx="172" cy="151" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="158" rx="22" ry="28" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="158" r="10" fill="#000000"/><circle cx="240" cy="151" r="3.5" fill="#FFFFFF"/>
<path d="M168 255 Q200 300 232 255" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 72)"><g class="pgi">
    <rect x="-22" y="0" width="44" height="32" rx="3" fill="#FF5A6E" stroke="#000" stroke-width="3"/>
    <rect x="-6" y="0" width="12" height="32" fill="#FFD23A" stroke="#000" stroke-width="2"/>
    <rect x="-26" y="-8" width="52" height="12" rx="2" fill="#FF5A6E" stroke="#000" stroke-width="3"/>
  </g></g>
</svg>
