<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="run-title run-desc" style="overflow:visible">
  <title id="run-title">跑步</title>
  <desc id="run-desc">Running</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: run 0.42s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 90px 230px; animation: runArmL 0.42s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 310px 235px; animation: runArmR 0.42s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes run {
      0%,100% { transform: translateY(0) translateX(-3px) rotate(-2deg) scale(1,1); }
      50% { transform: translateY(-8px) translateX(3px) rotate(2deg) scale(0.98,1.03); }
    }
    @keyframes runArmL { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-18deg); } }
    @keyframes runArmR { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(18deg); } }

.pml{animation:ml .42s cubic-bezier(0.22, 0.9, 0.3, 1) infinite}@keyframes ml{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.9;transform:translateX(-6px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M90 230 Q72 202 55 175" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="55" cy="175" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M45 169 Q55 163 65 169" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M310 235 Q330 260 350 285" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="350" cy="285" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M340 279 Q350 273 360 279" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="176" cy="157" r="10" fill="#000000"/><circle cx="180" cy="152" r="3" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="244" cy="157" r="10" fill="#000000"/><circle cx="248" cy="152" r="3" fill="#FFFFFF"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="pml" stroke="#000" stroke-width="4" stroke-linecap="round" opacity=".6">
    <line x1="48" y1="160" x2="28" y2="160"/><line x1="52" y1="185" x2="30" y2="185"/><line x1="50" y1="210" x2="32" y2="210"/>
  </g>
</svg>
