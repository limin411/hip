<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="jump-rope-title jump-rope-desc" style="overflow:hidden">
  <title id="jump-rope-title">跳绳</title>
  <desc id="jump-rope-desc">Jump rope</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: jump 1.05s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .arm-l { transform-origin: 80px 230px; animation: raiseL 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 320px 230px; animation: raiseR 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes jump {
      0%,100% { transform: translateY(0) scale(1,1); }
      12% { transform: translateY(3px) scale(1.04,0.94); }
      40% { transform: translateY(-14px) scale(0.97,1.04); }
      65% { transform: translateY(0) scale(1.03,0.97); }
    }
    @keyframes raiseL { 0%,100% { transform: rotate(-4deg); } 40% { transform: rotate(-16deg); } }
    @keyframes raiseR { 0%,100% { transform: rotate(4deg); } 40% { transform: rotate(16deg); } }

.prp{animation:rp .55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite}@keyframes rp{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>
<g class="arm-l">
      <path d="M80 230 Q66 169 52 108" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="52" cy="108" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M42 102 Q52 96 62 102" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g><g class="arm-r">
      <path d="M320 230 Q334 169 348 108" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="348" cy="108" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M338 102 Q348 96 358 102" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 160 Q234 148 252 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
<path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="prp" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
    <path d="M95 300 Q200 340 305 300"/>
    <path d="M95 300 Q80 200 52 112"/><path d="M305 300 Q320 200 348 112"/>
  </g>
</svg>
