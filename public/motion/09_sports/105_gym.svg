<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="gym-title gym-desc" style="overflow:hidden">
  <title id="gym-title">撸铁</title>
  <desc id="gym-desc">Lifting</desc>
  <style>

    .root { transform-origin: 200px 290px; animation: lift 1.15s cubic-bezier(0.33, 0, 0.2, 1) infinite; }
    .arm-l { transform-origin: 70px 220px; animation: liftArm 1.15s cubic-bezier(0.33, 0, 0.2, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: liftArm 1.15s cubic-bezier(0.33, 0, 0.2, 1) infinite; }
    @keyframes lift {
      0%,100% { transform: translateY(0); } 45% { transform: translateY(-8px); } 70% { transform: translateY(1px); }
    }
    @keyframes liftArm { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-11px); } }

.pdb{animation:db 1.15s cubic-bezier(0.33, 0, 0.2, 1) infinite}@keyframes db{0%,100%{transform:translateY(0)}45%{transform:translateY(-11px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 240 Q65 208 45 175" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="45" cy="175" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M35 169 Q45 163 55 169" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M315 240 Q335 208 355 175" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="355" cy="175" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M345 169 Q355 163 365 169" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 140 L184 150" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M252 150 L216 140" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="166" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="166" r="9" fill="#000000"/>
    <ellipse cx="234" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="166" r="9" fill="#000000"/>
<path d="M176 278 L224 278" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 68)"><g class="pdb">
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#888" stroke="#000" stroke-width="2.5"/>
    <rect x="-28" y="-12" width="14" height="24" rx="3" fill="#555" stroke="#000" stroke-width="2.5"/>
    <rect x="14" y="-12" width="14" height="24" rx="3" fill="#555" stroke="#000" stroke-width="2.5"/>
  </g></g>
</svg>
