<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="stretch-title stretch-desc" style="overflow:visible">
  <title id="stretch-title">拉伸</title>
  <desc id="stretch-desc">Stretch</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sway {
      0%,100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(3px) rotate(1.8deg); }
      75% { transform: translateX(-3px) rotate(-1.8deg); }
    }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M70 220 Q48 190 25 160" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="25" cy="160" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M15 154 Q25 148 35 154" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M330 220 Q352 190 375 160" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="375" cy="160" r="20" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M365 154 Q375 148 385 154" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="150" r="10" fill="#000000"/><circle cx="174" cy="145" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="150" r="10" fill="#000000"/><circle cx="242" cy="145" r="3.5" fill="#FFFFFF"/>
<path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>
