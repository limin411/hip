<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="soccer-title soccer-desc" style="overflow:hidden">
  <title id="soccer-title">足球</title>
  <desc id="soccer-desc">Soccer</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: kick 0.85s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes kick {
      0%,100% { transform: rotate(0) translateX(0); }
      35% { transform: rotate(-5deg) translateX(-4px); }
      55% { transform: rotate(7deg) translateX(8px); }
    }

.psc{animation:sc .8s cubic-bezier(0.22, 0.9, 0.3, 1) infinite}@keyframes sc{0%,100%{transform:translate(0,0) rotate(0)}40%{transform:translate(-8px,-12px) rotate(-40deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 230 Q68 215 50 200" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="50" cy="200" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M40 194 Q50 188 60 194" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M315 230 Q338 215 360 200" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="360" cy="200" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M350 194 Q360 188 370 194" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="170" cy="168" r="10" fill="#000000"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="238" cy="168" r="10" fill="#000000"/>
<path d="M188 272 Q210 290 232 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(85 290)"><g class="psc">
    <circle r="16" fill="#FFF" stroke="#000" stroke-width="3.5"/>
    <path d="M0-8L6-2L4 6L-4 6L-6-2Z" fill="#000"/>
  </g></g>
</svg>
