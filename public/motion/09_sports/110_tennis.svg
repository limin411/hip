<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="tennis-title tennis-desc" style="overflow:visible">
  <title id="tennis-title">网球</title>
  <desc id="tennis-desc">Tennis</desc>
  <style>

    .root { transform-origin: 200px 290px; animation: bob 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: thumbs 1.5s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes thumbs { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg) translateY(-4px); } }


  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 238 Q70 264 55 290" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="55" cy="290" r="16" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M45 284 Q55 278 65 284" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M315 230 Q350 200 365 150" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="370" cy="125" rx="16" ry="22" fill="none" stroke="#000000" stroke-width="5"/>
      <line x1="370" y1="147" x2="370" y2="175" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
      <circle cx="390" cy="115" r="7" fill="#FFD23A" stroke="#000000" stroke-width="2.5"/>
    </g>

    <ellipse cx="166" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="176" cy="157" r="10" fill="#000000"/><circle cx="180" cy="152" r="3" fill="#FFFFFF"/>
    <ellipse cx="234" cy="160" rx="18" ry="23" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="244" cy="157" r="10" fill="#000000"/><circle cx="248" cy="152" r="3" fill="#FFFFFF"/>
<path d="M188 272 Q210 290 232 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

</svg>
