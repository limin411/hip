<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="swim-title swim-desc" style="overflow:hidden">
  <title id="swim-title">游泳</title>
  <desc id="swim-desc">Swim</desc>
  <style>

    .root { transform-origin: 200px 240px; animation: floaty 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

.pw1{animation:dr 1.2s cubic-bezier(0.33, 0, 0.2, 1) infinite}.pw2{animation:dr 1.2s cubic-bezier(0.33, 0, 0.2, 1) .4s infinite}@keyframes dr{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M85 230 Q62 190 40 150" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="40" cy="150" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M30 144 Q40 138 50 144" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M320 240 Q342 260 365 280" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="365" cy="280" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M355 274 Q365 268 375 274" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path d="M148 160 Q166 148 184 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M216 160 Q234 148 252 160" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
<path d="M176 268 Q200 292 224 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(100 90)"><g class="pw1"><ellipse rx="5" ry="8" fill="#78BEFF" stroke="#000" stroke-width="2"/></g></g>
  <g transform="translate(300 80)"><g class="pw2"><ellipse rx="5" ry="8" fill="#78BEFF" stroke="#000" stroke-width="2"/></g></g>
  <g transform="translate(200 58)">
    <rect x="-8" y="0" width="16" height="28" rx="4" fill="#78BEFF" stroke="#000" stroke-width="2.5"/>
    <rect x="-10" y="-6" width="20" height="8" rx="2" fill="#5B9BD5" stroke="#000" stroke-width="2"/>
  </g>
</svg>
