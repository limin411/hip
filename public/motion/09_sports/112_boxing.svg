<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72 -72 544 544" width="512" height="512" role="img" aria-labelledby="boxing-title boxing-desc" style="overflow:visible">
  <title id="boxing-title">拳击</title>
  <desc id="boxing-desc">Boxing</desc>
  <style>

    .root { transform-origin: 200px 280px; animation: shake 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-l { transform-origin: 70px 220px; animation: punchL 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    .arm-r { transform-origin: 330px 220px; animation: punchR 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) infinite; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    @keyframes punchL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes punchR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }

.ps { animation: sp 1.4s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; transform-origin:0 0; }@keyframes sp { 0%,40%,100%{opacity:0;transform:scale(.6)} 55%,70%{opacity:1;transform:scale(1)} }
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <path d="M148 140 L184 150" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <path d="M252 150 L216 140" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="166" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="168" cy="166" r="9" fill="#000000"/>
    <ellipse cx="234" cy="164" rx="16" ry="18" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <circle cx="236" cy="166" r="9" fill="#000000"/>
<path d="M188 272 Q210 290 232 268" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M95 235 Q108 205 120 175" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="120" cy="175" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M110 169 Q120 163 130 169" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M305 235 Q292 205 280 175" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="280" cy="175" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M270 169 Q280 163 290 169" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
  </g>

  <g transform="translate(305 110)"><g class="ps"><path d="M0-12L0 12M-12 0L12 0M-8-8L8 8M-8 8L8-8" stroke="#000" stroke-width="3.5" stroke-linecap="round"/></g></g>
</svg>
