<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="512" height="512" role="img" aria-labelledby="victory-lap-title victory-lap-desc" style="overflow:hidden">
  <title id="victory-lap-title">夺冠</title>
  <desc id="victory-lap-desc">Victory medal</desc>
  <style>

    .root { transform-origin: 200px 300px; animation: jump 1.05s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .arm-l { transform-origin: 80px 230px; animation: raiseL 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .arm-r { transform-origin: 320px 230px; animation: raiseR 1.05s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes jump {
      0%,100% { transform: translateY(0) scale(1,1); }
      12% { transform: translateY(3px) scale(1.04,0.94); }
      40% { transform: translateY(-14px) scale(0.97,1.04); }
      65% { transform: translateY(0) scale(1.03,0.97); }
    }
    @keyframes raiseL { 0%,100% { transform: rotate(-4deg); } 40% { transform: rotate(-16deg); } }
    @keyframes raiseR { 0%,100% { transform: rotate(4deg); } 40% { transform: rotate(16deg); } }

.pmd{animation:md 1.3s cubic-bezier(0.45, 0, 0.55, 1) infinite}@keyframes md{0%,100%{transform:rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
  </style>
  <g class="root">

    <ellipse cx="152" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <ellipse cx="248" cy="208" rx="90" ry="102" fill="#FF9800"/>
    <path d="M200 128 Q192 208 200 278" fill="none" stroke="#E87E00" stroke-width="10" stroke-linecap="round"/>

    <g class="arm-l">
      <path d="M75 220 Q58 160 40 100" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="40" cy="100" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M30 94 Q40 88 50 94" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="arm-r">
      <path d="M325 220 Q342 160 360 100" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      
      <circle cx="360" cy="100" r="24" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
      <path d="M350 94 Q360 88 370 94" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/></g>

    <path fill="#FFD23A" stroke="#000000" stroke-width="2" d="M166 140 L170 154 L184 154 L173 162 L177 176 L166 168 L155 176 L159 162 L148 154 L162 154Z"/>
    <path fill="#FFD23A" stroke="#000000" stroke-width="2" d="M234 140 L238 154 L252 154 L241 162 L245 176 L234 168 L223 176 L227 162 L216 154 L230 154Z"/>
<path d="M168 255 Q200 300 232 255" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(200 66)"><g class="pmd">
    <path d="M-12-8L-6 8L6 8L12-8" fill="none" stroke="#FF5A6E" stroke-width="4" stroke-linecap="round"/>
    <circle cy="18" r="14" fill="#FFD23A" stroke="#000" stroke-width="3"/>
    <text x="0" y="24" text-anchor="middle" font-size="14" font-family="Arial" font-weight="700">1</text>
  </g></g>
</svg>
