<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物跳舞">
  <defs>
    <style>

      .player { animation: dance 0.65s ease-in-out infinite; transform-origin: 500px 550px; }
      .arm-l { animation: al 0.65s ease-in-out infinite; transform-origin: 420px 400px; }
      .arm-r { animation: ar 0.65s ease-in-out infinite; transform-origin: 580px 400px; }
      .leg-l { animation: ll 0.65s ease-in-out infinite; transform-origin: 460px 600px; }
      .leg-r { animation: lr 0.65s ease-in-out infinite; transform-origin: 540px 600px; }
      .head { animation: head 0.65s ease-in-out infinite; transform-origin: 500px 250px; }
      .note { animation: note 0.65s ease-in-out infinite; }
      @keyframes dance { 0%,100%{transform:rotate(-8deg) translateY(0)} 50%{transform:rotate(8deg) translateY(-20px)} }
      @keyframes al { 0%,100%{transform:rotate(-50deg)} 50%{transform:rotate(20deg)} }
      @keyframes ar { 0%,100%{transform:rotate(50deg)} 50%{transform:rotate(-20deg)} }
      @keyframes ll { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(-25deg)} }
      @keyframes lr { 0%,100%{transform:rotate(-20deg)} 50%{transform:rotate(25deg)} }
      @keyframes head { 0%,100%{transform:rotate(8deg)} 50%{transform:rotate(-8deg)} }
      @keyframes note { 0%,100%{opacity:.3;transform:translateY(0)} 50%{opacity:1;transform:translateY(-20px)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="note" fill="#e07a3a" font-size="40">
    <text x="700" y="300">♪</text><text x="750" y="250">♫</text>
  </g>
  <g class="player">
    <g class="leg-l"><line x1="460" y1="600" x2="400" y2="820" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="390" cy="838" rx="32" ry="15" fill="#e07a3a"/></g>
    <g class="leg-r"><line x1="540" y1="600" x2="620" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="635" cy="815" rx="32" ry="15" fill="#e07a3a"/></g>
    <ellipse cx="500" cy="480" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M420 390 C435 345 565 345 580 390 L590 540 C570 580 430 580 410 540 Z" fill="#e85a9a"/>
    <path d="M425 520 C440 575 560 575 575 520 L565 610 C530 635 470 635 435 610 Z" fill="#5b3a8a"/>
    <g class="arm-l"><line x1="420" y1="400" x2="320" y2="280" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/><circle cx="308" cy="268" r="24" fill="#9faf8b"/></g>
    <g class="arm-r"><line x1="580" y1="400" x2="720" y2="320" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/><circle cx="732" cy="310" r="24" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
