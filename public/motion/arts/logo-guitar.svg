<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物弹吉他">
  <defs>
    <style>

      .player { animation: bob 0.8s ease-in-out infinite; transform-origin: 480px 500px; }
      .arm-strum { animation: strum 0.4s ease-in-out infinite; transform-origin: 560px 420px; }
      .arm-fret { animation: fret 0.8s ease-in-out infinite; transform-origin: 400px 400px; }
      .head { animation: head 0.8s ease-in-out infinite; transform-origin: 480px 250px; }
      @keyframes bob { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg) translateY(-6px)} }
      @keyframes strum { 0%,100%{transform:rotate(15deg)} 50%{transform:rotate(35deg)} }
      @keyframes fret { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(-5deg) translate(5px,5px)} }
      @keyframes head { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="player">
    <line x1="450" y1="600" x2="420" y2="820" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="520" y1="600" x2="560" y2="820" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="410" cy="838" rx="32" ry="15" fill="#5c4030"/><ellipse cx="575" cy="838" rx="32" ry="15" fill="#5c4030"/>
    <ellipse cx="480" cy="480" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 345 545 345 560 390 L570 540 C550 580 410 580 390 540 Z" fill="#6a4c9c"/>
    <path d="M405 520 C420 575 540 575 555 520 L545 610 C510 630 450 630 415 610 Z" fill="#3d2a5c"/>
    <!-- guitar body -->
    <ellipse cx="520" cy="580" rx="70" ry="95" fill="#c4a060" transform="rotate(20 520 580)"/>
    <circle cx="520" cy="560" r="22" fill="#2a2a2a" transform="rotate(20 520 560)"/>
    <rect x="530" y="400" width="18" height="160" rx="6" fill="#a08040" transform="rotate(20 539 480)"/>
    <g class="arm-fret"><line x1="400" y1="400" x2="500" y2="480" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/><circle cx="512" cy="490" r="22" fill="#9faf8b"/></g>
    <g class="arm-strum"><line x1="560" y1="420" x2="580" y2="560" stroke="#a8b994" stroke-width="42" stroke-linecap="round"/><circle cx="585" cy="575" r="22" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="480" y1="330" x2="480" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="480" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="440" y1="180" x2="420" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="520" y1="178" x2="542" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="417" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="545" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="435" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="530" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M435 220 Q460 208 482 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M492 218 Q515 206 540 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="455" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="515" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="458" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="518" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="461" cy="245" r="2.8" fill="#fff"/>
      <circle cx="521" cy="243" r="2.8" fill="#fff"/>
      <path d="M455 288 Q485 308 515 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="455" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
