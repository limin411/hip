<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物弹钢琴">
  <defs>
    <style>

      .player{animation:bob 1s ease-in-out infinite;transform-origin:500px 480px}
      .hand-l{animation:hl .4s ease-in-out infinite;transform-origin:420px 500px}
      .hand-r{animation:hr .4s ease-in-out infinite;transform-origin:580px 500px}
      .head{animation:h 1s ease-in-out infinite;transform-origin:500px 250px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes hl{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
      @keyframes hr{0%,100%{transform:translateY(6px)}50%{transform:translateY(-2px)}}
      @keyframes h{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <!-- piano -->
  <rect x="200" y="620" width="600" height="120" rx="8" fill="#222"/>
  <g fill="#fff">
    <rect x="220" y="640" width="36" height="80" rx="2"/><rect x="260" y="640" width="36" height="80" rx="2"/><rect x="300" y="640" width="36" height="80" rx="2"/><rect x="340" y="640" width="36" height="80" rx="2"/><rect x="380" y="640" width="36" height="80" rx="2"/><rect x="420" y="640" width="36" height="80" rx="2"/><rect x="460" y="640" width="36" height="80" rx="2"/><rect x="500" y="640" width="36" height="80" rx="2"/><rect x="540" y="640" width="36" height="80" rx="2"/><rect x="580" y="640" width="36" height="80" rx="2"/><rect x="620" y="640" width="36" height="80" rx="2"/><rect x="660" y="640" width="36" height="80" rx="2"/><rect x="700" y="640" width="36" height="80" rx="2"/><rect x="740" y="640" width="36" height="80" rx="2"/>
  </g>
  <g fill="#111">
    <rect x="242" y="640" width="20" height="50" rx="1"/><rect x="282" y="640" width="20" height="50" rx="1"/><rect x="362" y="640" width="20" height="50" rx="1"/><rect x="402" y="640" width="20" height="50" rx="1"/><rect x="442" y="640" width="20" height="50" rx="1"/><rect x="522" y="640" width="20" height="50" rx="1"/><rect x="562" y="640" width="20" height="50" rx="1"/><rect x="642" y="640" width="20" height="50" rx="1"/><rect x="682" y="640" width="20" height="50" rx="1"/><rect x="722" y="640" width="20" height="50" rx="1"/>
  </g>
  <g class="player">
    <line x1="460" y1="580" x2="450" y2="620" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/>
    <line x1="540" y1="580" x2="550" y2="620" stroke="url(#skin)" stroke-width="40" stroke-linecap="round"/>
    <ellipse cx="500" cy="450" rx="90" ry="100" fill="url(#skin)"/>
    <path d="M420 370 C435 330 565 330 580 370 L590 520 C570 560 430 560 410 520 Z" fill="#2a2a2a"/>
    <g class="hand-l"><line x1="430" y1="420" x2="400" y2="620" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/><ellipse cx="395" cy="640" rx="24" ry="16" fill="#9faf8b"/></g>
    <g class="hand-r"><line x1="570" y1="420" x2="600" y2="620" stroke="#a8b994" stroke-width="40" stroke-linecap="round"/><ellipse cx="605" cy="640" rx="24" ry="16" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
