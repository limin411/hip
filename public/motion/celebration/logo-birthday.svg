<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物过生日">
  <defs>
    <style>

      .player{animation:bob .8s ease-in-out infinite;transform-origin:500px 500px}
      .arm{animation:cheer .8s ease-in-out infinite;transform-origin:500px 400px}
      .flame{animation:flame .3s ease-in-out infinite;transform-origin:500px 480px}
      .conf1{animation:c1 1.5s ease-out infinite}
      .conf2{animation:c2 1.5s ease-out infinite .3s}
      .head{animation:h .8s ease-in-out infinite;transform-origin:500px 250px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes cheer{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
      @keyframes flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.2)}}
      @keyframes c1{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(-40px,60px) rotate(40deg)}}
      @keyframes c2{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(50px,50px) rotate(-30deg)}}
      @keyframes h{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <g class="conf1" fill="#e85a9a"><rect x="300" y="300" width="16" height="10" rx="2"/></g>
  <g class="conf2" fill="#f0c36a"><rect x="700" y="280" width="14" height="10" rx="2"/></g>
  <!-- cake -->
  <rect x="420" y="620" width="160" height="80" rx="8" fill="#f5c0d0"/>
  <rect x="430" y="580" width="140" height="50" rx="6" fill="#fff0f5"/>
  <g class="flame"><ellipse cx="500" cy="560" rx="10" ry="18" fill="#f0c36a"/><ellipse cx="500" cy="555" rx="5" ry="10" fill="#e07a3a"/></g>
  <rect x="495" y="575" width="10" height="25" fill="#5bb8d4"/>
  <g class="player">
    <line x1="460" y1="720" x2="440" y2="860" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/>
    <line x1="540" y1="720" x2="560" y2="860" stroke="url(#skin)" stroke-width="44" stroke-linecap="round"/>
    <ellipse cx="430" cy="875" rx="28" ry="12" fill="#e85a9a"/><ellipse cx="570" cy="875" rx="28" ry="12" fill="#e85a9a"/>
    <ellipse cx="500" cy="480" rx="90" ry="100" fill="url(#skin)"/>
    <path d="M420 400 C435 355 565 355 580 400 L590 560 C570 600 430 600 410 560 Z" fill="#e85a9a"/>
    <g class="arm">
      <line x1="420" y1="420" x2="340" y2="300" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
      <circle cx="328" cy="288" r="22" fill="#9faf8b"/>
      <line x1="580" y1="420" x2="660" y2="300" stroke="#a8b994" stroke-width="42" stroke-linecap="round"/>
      <circle cx="672" cy="288" r="22" fill="#9faf8b"/>
    </g>
    <!-- party hat -->
    <path d="M450 200 L500 100 L550 200 Z" fill="#5bb8d4"/>
    <circle cx="500" cy="100" r="12" fill="#f0c36a"/>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
