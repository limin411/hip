<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物拆礼物">
  <defs>
    <style>

      .player{animation:bob 1s ease-in-out infinite;transform-origin:500px 500px}
      .lid{animation:lid 1.5s ease-in-out infinite;transform-origin:500px 620px}
      .arm-l{animation:al 1.5s ease-in-out infinite;transform-origin:420px 400px}
      .arm-r{animation:ar 1.5s ease-in-out infinite;transform-origin:580px 400px}
      .head{animation:h 1.5s ease-in-out infinite;transform-origin:500px 250px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes lid{0%,40%{transform:translateY(0) rotate(0)}70%{transform:translateY(-50px) rotate(-15deg)}100%{transform:translateY(0) rotate(0)}}
      @keyframes al{0%,40%{transform:rotate(20deg)}70%{transform:rotate(-10deg)}100%{transform:rotate(20deg)}}
      @keyframes ar{0%,40%{transform:rotate(-20deg)}70%{transform:rotate(10deg)}100%{transform:rotate(-20deg)}}
      @keyframes h{0%,40%{transform:rotate(0)}70%{transform:rotate(-8deg)}100%{transform:rotate(0)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <rect x="400" y="680" width="200" height="150" rx="8" fill="#e85a5a"/>
  <rect x="490" y="680" width="20" height="150" fill="#f0c36a"/>
  <rect x="400" y="740" width="200" height="20" fill="#f0c36a"/>
  <g class="lid">
    <rect x="385" y="650" width="230" height="40" rx="6" fill="#c45c5c"/>
    <rect x="490" y="640" width="20" height="50" fill="#f0c36a"/>
    <circle cx="500" cy="640" r="16" fill="#f0c36a"/>
  </g>
  <g class="player">
    <line x1="460" y1="600" x2="440" y2="780" stroke="url(#skin2)" stroke-width="46" stroke-linecap="round"/>
    <line x1="540" y1="600" x2="560" y2="780" stroke="url(#skin)" stroke-width="46" stroke-linecap="round"/>
    <ellipse cx="430" cy="795" rx="28" ry="14" fill="#5c4030"/><ellipse cx="570" cy="795" rx="28" ry="14" fill="#5c4030"/>
    <ellipse cx="500" cy="480" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M420 390 C435 345 565 345 580 390 L590 540 C570 580 430 580 410 540 Z" fill="#5bb8d4"/>
    <path d="M425 520 C440 575 560 575 575 520 L565 610 C530 630 470 630 435 610 Z" fill="#3a8ab0"/>
    <g class="arm-l"><line x1="420" y1="400" x2="400" y2="620" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/><circle cx="395" cy="640" r="24" fill="#9faf8b"/></g>
    <g class="arm-r"><line x1="580" y1="400" x2="600" y2="620" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/><circle cx="605" cy="640" r="24" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
