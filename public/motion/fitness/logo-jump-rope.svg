<svg viewBox="0 0 1000 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物跳绳动画（插画拟人）">
  <defs>
    <style>
      .player {
        animation: jump 0.72s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: 500px 700px;
      }
      .head {
        animation: head-bob 0.72s ease-in-out infinite;
        transform-origin: 500px 280px;
      }
      .arm-l {
        animation: arm-l 0.72s ease-in-out infinite;
        transform-origin: 415px 430px;
      }
      .arm-r {
        animation: arm-r 0.72s ease-in-out infinite;
        transform-origin: 585px 430px;
      }
      .leg-l {
        animation: leg-l 0.72s ease-in-out infinite;
        transform-origin: 460px 620px;
      }
      .leg-r {
        animation: leg-r 0.72s ease-in-out infinite;
        transform-origin: 540px 620px;
      }
.rope-front { animation: rope-front 0.72s linear infinite; }
      .rope-back  { animation: rope-back 0.72s linear infinite; }

      @keyframes jump {
        0%, 100% { transform: translateY(-90px) scale(0.99, 1.03); }
        18% { transform: translateY(-28px) scale(1, 1); }
        32% { transform: translateY(10px) scale(1.02, 0.96); }
        45% { transform: translateY(14px) scale(1.02, 0.95); }
        58% { transform: translateY(2px) scale(1.01, 0.98); }
        75% { transform: translateY(-80px) scale(0.99, 1.04); }
        90% { transform: translateY(-95px) scale(0.99, 1.03); }
      }
      @keyframes head-bob {
        0%, 100% { transform: rotate(-2deg); }
        35% { transform: rotate(2deg) translateY(3px); }
        70% { transform: rotate(-1deg); }
      }
      @keyframes arm-l {
        0%, 100% { transform: rotate(4deg); }
        50% { transform: rotate(-6deg); }
      }
      @keyframes arm-r {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(6deg); }
      }
      @keyframes leg-l {
        0%, 100% { transform: rotate(-5deg); }
        40% { transform: rotate(6deg); }
      }
      @keyframes leg-r {
        0%, 100% { transform: rotate(5deg); }
        40% { transform: rotate(-6deg); }
      }
35%, 50% { transform: scale(1.05, 1); opacity: 0.16; }
        75%, 90% { transform: scale(0.5, 0.65); opacity: 0.07; }
      }
      @keyframes rope-front {
        0%, 30% { opacity: 1; }
        36%, 48% { opacity: 0; }
        56%, 100% { opacity: 1; }
      }
      @keyframes rope-back {
        0%, 30% { opacity: 0; }
        36%, 48% { opacity: 1; }
        56%, 100% { opacity: 0; }
      }
    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb89a"/>
      <stop offset="100%" stop-color="#6a9a78"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4923a"/>
      <stop offset="50%" stop-color="#f0c36a"/>
      <stop offset="100%" stop-color="#d4923a"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
<g class="player">
    <!-- 1) 过顶绳（身体后面） -->
    <g class="rope-back" fill="none" stroke="url(#ropeGrad)" stroke-width="18" stroke-linecap="round">
      <path d="M 300 560 C 180 900, 820 900, 700 560">
        <animate
          attributeName="d" dur="0.72s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.15;0.32;0.42;0.52;0.70;1"
          values="
            M 300 560 C 180 900, 820 900, 700 560;
            M 300 560 C 170 760, 830 760, 700 560;
            M 300 560 C 150 280, 850 280, 700 560;
            M 300 560 C 140 70, 860 70, 700 560;
            M 300 560 C 150 280, 850 280, 700 560;
            M 300 560 C 170 760, 830 760, 700 560;
            M 300 560 C 180 900, 820 900, 700 560
          "
        />
      </path>
    </g>

    <!-- 2) 腿 -->
    <g class="leg-l">
      <line x1="460" y1="620" x2="430" y2="820" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="420" cy="838" rx="34" ry="16" fill="#3d342c" transform="rotate(-8 420 838)"/>
    </g>
    <g class="leg-r">
      <line x1="540" y1="620" x2="570" y2="820" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="580" cy="838" rx="34" ry="16" fill="#3d342c" transform="rotate(8 580 838)"/>
    </g>

    <!-- 3) 躯干 -->
    <g>
      <ellipse cx="500" cy="500" rx="95" ry="115" fill="url(#skin)"/>
      <path d="M420 410 C 435 365, 565 365, 580 410 L 590 560 C 575 595, 425 595, 410 560 Z" fill="url(#top)"/>
      <ellipse cx="500" cy="470" rx="32" ry="22" fill="#fff" opacity="0.12"/>
      <path d="M420 545 C 435 600, 565 600, 580 545 L 570 630 C 535 650, 465 650, 430 630 Z" fill="#3d5a46"/>
    </g>

    <!-- 4) 连贯左臂：肩→肘→手 一条 path，圆角相接 -->
    <g class="arm-l">
      <path
        d="M 415 430 Q 355 490 300 560"
        fill="none"
        stroke="url(#skin2)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>
      <rect x="278" y="528" width="16" height="48" rx="8" fill="#5c4030" transform="rotate(-28 286 552)"/>
      <circle cx="300" cy="560" r="28" fill="#9faf8b"/>
      <circle cx="290" cy="548" r="8" fill="#b3c29e" opacity="0.5"/>
    </g>

    <!-- 5) 连贯右臂 -->
    <g class="arm-r">
      <path
        d="M 585 430 Q 645 490 700 560"
        fill="none"
        stroke="#a8b994"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>
      <rect x="706" y="528" width="16" height="48" rx="8" fill="#5c4030" transform="rotate(28 714 552)"/>
      <circle cx="700" cy="560" r="28" fill="#9faf8b"/>
      <circle cx="710" cy="548" r="8" fill="#b3c29e" opacity="0.5"/>
    </g>

    <!-- 6) 头 -->
    <g class="head">
      <line x1="500" y1="400" x2="500" y2="340" stroke="#9faf8b" stroke-width="34" stroke-linecap="round"/>
      <circle cx="500" cy="270" r="88" fill="url(#skin)"/>
      <line x1="460" y1="200" x2="440" y2="158" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <line x1="540" y1="198" x2="562" y2="156" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <circle cx="437" cy="153" r="11" fill="#9faf8b"/>
      <circle cx="565" cy="152" r="11" fill="#9faf8b"/>
      <circle cx="455" cy="290" r="16" fill="url(#blush)"/>
      <circle cx="550" cy="288" r="15" fill="url(#blush)"/>
      <path d="M455 240 Q480 228 502 240" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <path d="M512 238 Q535 226 560 240" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="475" cy="270" rx="21" ry="19" fill="#fff"/>
      <ellipse cx="535" cy="268" rx="21" ry="19" fill="#fff"/>
      <circle cx="478" cy="270" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="268" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="265" r="2.8" fill="#fff"/>
      <circle cx="541" cy="263" r="2.8" fill="#fff"/>
      <path d="M475 308 Q505 328 535 306" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="475" cy="228" rx="18" ry="10" fill="#fff" opacity="0.28"/>
    </g>

    <!-- 7) 过脚绳（身体前面）端点 = 双手中心 -->
    <g class="rope-front" fill="none" stroke="url(#ropeGrad)" stroke-width="18" stroke-linecap="round">
      <path d="M 300 560 C 180 900, 820 900, 700 560">
        <animate
          attributeName="d" dur="0.72s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.15;0.32;0.42;0.52;0.70;1"
          values="
            M 300 560 C 180 900, 820 900, 700 560;
            M 300 560 C 170 760, 830 760, 700 560;
            M 300 560 C 150 280, 850 280, 700 560;
            M 300 560 C 140 70, 860 70, 700 560;
            M 300 560 C 150 280, 850 280, 700 560;
            M 300 560 C 170 760, 830 760, 700 560;
            M 300 560 C 180 900, 820 900, 700 560
          "
        />
      </path>
    </g>

    <!-- 8) 手再盖在绳端上，保证握绳完整 -->
    <g class="arm-l">
      <circle cx="300" cy="560" r="28" fill="#9faf8b"/>
      <circle cx="290" cy="548" r="8" fill="#b3c29e" opacity="0.5"/>
    </g>
    <g class="arm-r">
      <circle cx="700" cy="560" r="28" fill="#9faf8b"/>
      <circle cx="710" cy="548" r="8" fill="#b3c29e" opacity="0.5"/>
    </g>
  </g>
</svg>
