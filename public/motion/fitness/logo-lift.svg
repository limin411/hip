<svg viewBox="0 0 1100 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物举重">
  <defs>
    <style>

      .player { animation: lift 1.4s ease-in-out infinite; transform-origin: 550px 550px; }
      .bar { animation: bar 1.4s ease-in-out infinite; }
      .arm-l { animation: al 1.4s ease-in-out infinite; transform-origin: 470px 420px; }
      .arm-r { animation: ar 1.4s ease-in-out infinite; transform-origin: 630px 420px; }
      .leg-l { animation: ll 1.4s ease-in-out infinite; transform-origin: 510px 600px; }
      .leg-r { animation: lr 1.4s ease-in-out infinite; transform-origin: 590px 600px; }
      .head { animation: head 1.4s ease-in-out infinite; transform-origin: 550px 270px; }
      @keyframes lift { 0%,20%{transform:translateY(20px)} 50%,70%{transform:translateY(-40px)} 100%{transform:translateY(20px)} }
      @keyframes bar { 0%,20%{transform:translateY(80px)} 50%,70%{transform:translateY(-200px)} 100%{transform:translateY(80px)} }
      @keyframes al { 0%,20%{transform:rotate(50deg)} 50%,70%{transform:rotate(-20deg)} 100%{transform:rotate(50deg)} }
      @keyframes ar { 0%,20%{transform:rotate(-50deg)} 50%,70%{transform:rotate(20deg)} 100%{transform:rotate(-50deg)} }
      @keyframes ll { 0%,20%{transform:rotate(15deg)} 50%,70%{transform:rotate(0)} 100%{transform:rotate(15deg)} }
      @keyframes lr { 0%,20%{transform:rotate(-15deg)} 50%,70%{transform:rotate(0)} 100%{transform:rotate(-15deg)} }
      @keyframes head { 0%,20%{transform:rotate(0)} 50%,70%{transform:rotate(-5deg) translateY(-8px)} 100%{transform:rotate(0)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="bar">
    <line x1="250" y1="400" x2="850" y2="400" stroke="#555" stroke-width="14" stroke-linecap="round"/>
    <circle cx="250" cy="400" r="36" fill="#333"/><circle cx="220" cy="400" r="28" fill="#222"/>
    <circle cx="850" cy="400" r="36" fill="#333"/><circle cx="880" cy="400" r="28" fill="#222"/>
  </g>
  <g class="player">
    <g class="leg-l"><line x1="510" y1="600" x2="470" y2="820" stroke="url(#skin2)" stroke-width="50" stroke-linecap="round"/>
      <ellipse cx="460" cy="838" rx="34" ry="16" fill="#2a2a2a"/></g>
    <g class="leg-r"><line x1="590" y1="600" x2="630" y2="820" stroke="url(#skin)" stroke-width="50" stroke-linecap="round"/>
      <ellipse cx="640" cy="838" rx="34" ry="16" fill="#2a2a2a"/></g>
    <ellipse cx="550" cy="490" rx="100" ry="120" fill="url(#skin)"/>
    <path d="M460 400 C475 355 625 355 640 400 L650 560 C630 600 470 600 450 560 Z" fill="#c45c5c"/>
    <path d="M465 540 C480 600 620 600 635 540 L625 640 C580 665 520 665 475 640 Z" fill="#2f3a4a"/>
    <g class="arm-l"><line x1="470" y1="420" x2="380" y2="400" stroke="url(#skin2)" stroke-width="46" stroke-linecap="round"/><circle cx="368" cy="396" r="26" fill="#9faf8b"/></g>
    <g class="arm-r"><line x1="630" y1="420" x2="720" y2="400" stroke="#a8b994" stroke-width="46" stroke-linecap="round"/><circle cx="732" cy="396" r="26" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="550" y1="350" x2="550" y2="320" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="550" cy="270" r="88.0" fill="url(#skin)"/>
      <line x1="510" y1="200" x2="490" y2="158" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="590" y1="198" x2="612" y2="156" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="487" cy="153" r="11.0" fill="#9faf8b"/>
      <circle cx="615" cy="152" r="11.0" fill="#9faf8b"/>
      <circle cx="505" cy="290" r="16.0" fill="url(#blush)"/>
      <circle cx="600" cy="288" r="15.0" fill="url(#blush)"/>
      <path d="M505 240 Q530 228 552 240" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M562 238 Q585 226 610 240" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="525" cy="270" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="585" cy="268" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="528" cy="270" r="8.5" fill="#1a1a1a"/>
      <circle cx="588" cy="268" r="8.5" fill="#1a1a1a"/>
      <circle cx="531" cy="265" r="2.8" fill="#fff"/>
      <circle cx="591" cy="263" r="2.8" fill="#fff"/>
      <path d="M525 308 Q555 328 585 306" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="525" cy="228" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
