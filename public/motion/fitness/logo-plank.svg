<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物平板支撑">
  <defs>
    <style>

      .player{animation:shake 1.5s ease-in-out infinite;transform-origin:500px 600px}
      .sweat{animation:sweat 1.5s ease-out infinite}
      @keyframes shake{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
      @keyframes sweat{0%{opacity:0;transform:translateY(0)}40%{opacity:.7}100%{opacity:0;transform:translateY(30px)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <!-- horizontal plank pose -->
  <g class="player">
    <ellipse cx="500" cy="620" rx="180" ry="55" fill="url(#skin)" transform="rotate(-5 500 620)"/>
    <circle cx="320" cy="560" r="70" fill="url(#skin)"/>
    <!-- face looking forward-ish -->
    <ellipse cx="300" cy="545" rx="16" ry="14" fill="#fff"/><ellipse cx="340" cy="542" rx="16" ry="14" fill="#fff"/>
    <circle cx="304" cy="545" r="6" fill="#1a1a1a"/><circle cx="344" cy="542" r="6" fill="#1a1a1a"/>
    <path d="M310 575 Q330 588 350 573" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <line x1="290" y1="500" x2="275" y2="465" stroke="#9faf8b" stroke-width="11" stroke-linecap="round"/>
    <line x1="350" y1="495" x2="368" y2="460" stroke="#9faf8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="272" cy="460" r="8" fill="#9faf8b"/><circle cx="372" cy="456" r="8" fill="#9faf8b"/>
    <!-- arms supporting -->
    <line x1="400" y1="640" x2="380" y2="780" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/>
    <line x1="480" y1="645" x2="500" y2="780" stroke="#a8b994" stroke-width="40" stroke-linecap="round"/>
    <ellipse cx="375" cy="795" rx="28" ry="14" fill="#9faf8b"/><ellipse cx="505" cy="795" rx="28" ry="14" fill="#9faf8b"/>
    <!-- legs extended -->
    <line x1="640" y1="630" x2="780" y2="680" stroke="url(#skin)" stroke-width="44" stroke-linecap="round"/>
    <line x1="620" y1="650" x2="760" y2="720" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/>
    <ellipse cx="800" cy="690" rx="26" ry="14" fill="#9faf8b"/><ellipse cx="780" cy="735" rx="26" ry="14" fill="#9faf8b"/>
    <path d="M420 600 L580 590 L590 660 L430 670 Z" fill="#5bb8d4" opacity="0.85"/>
  </g>
  <g class="sweat" fill="#7ec4e0"><circle cx="280" cy="600" r="5"/><circle cx="295" cy="620" r="4"/></g>

</svg>
