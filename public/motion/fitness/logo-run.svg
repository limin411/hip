<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物跑步">
  <defs>
    <style>

      .player { animation: bob 0.45s ease-in-out infinite; transform-origin: 480px 500px; }
      .leg-l { animation: run-l 0.45s ease-in-out infinite; transform-origin: 450px 560px; }
      .leg-r { animation: run-r 0.45s ease-in-out infinite; transform-origin: 510px 560px; }
      .arm-l { animation: arm-l 0.45s ease-in-out infinite; transform-origin: 420px 400px; }
      .arm-r { animation: arm-r 0.45s ease-in-out infinite; transform-origin: 540px 400px; }
      .head { animation: head 0.45s ease-in-out infinite; transform-origin: 500px 250px; }
      .dust { animation: dust 0.45s ease-out infinite; }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes run-l { 0%,100%{transform:rotate(35deg)} 50%{transform:rotate(-40deg)} }
      @keyframes run-r { 0%,100%{transform:rotate(-40deg)} 50%{transform:rotate(35deg)} }
      @keyframes arm-l { 0%,100%{transform:rotate(-40deg)} 50%{transform:rotate(35deg)} }
      @keyframes arm-r { 0%,100%{transform:rotate(35deg)} 50%{transform:rotate(-40deg)} }
      @keyframes head { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
      @keyframes dust { 0%{opacity:0;transform:translate(0,0)} 40%{opacity:.4} 100%{opacity:0;transform:translate(-40px,10px)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7eb8c9"/><stop offset="100%" stop-color="#4a8fa3"/>
    </linearGradient>

  </defs>
<g class="dust" fill="#ccc"><circle cx="400" cy="860" r="8"/><circle cx="370" cy="870" r="5"/></g>
  <g class="player">
    <g class="leg-l"><line x1="450" y1="560" x2="400" y2="780" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="390" cy="798" rx="32" ry="15" fill="#2a2a2a" transform="rotate(-20 390 798)"/></g>
    <g class="leg-r"><line x1="510" y1="560" x2="580" y2="760" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="595" cy="775" rx="32" ry="15" fill="#2a2a2a" transform="rotate(25 595 775)"/></g>
    <ellipse cx="480" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 350 545 350 560 390 L570 540 C555 575 405 575 390 540 Z" fill="url(#shirt)"/>
    <path d="M400 520 C415 575 545 575 560 520 L550 600 C520 620 440 620 410 600 Z" fill="#2f4a5c"/>
    <g class="arm-l"><line x1="420" y1="400" x2="340" y2="560" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/><circle cx="330" cy="575" r="24" fill="#9faf8b"/></g>
    <g class="arm-r"><line x1="540" y1="400" x2="640" y2="520" stroke="#a8b994" stroke-width="42" stroke-linecap="round"/><circle cx="652" cy="530" r="24" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="490" y1="330" x2="490" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="490" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="450" y1="180" x2="430" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="530" y1="178" x2="552" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="427" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="555" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="445" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="540" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M445 220 Q470 208 492 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M502 218 Q525 206 550 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="525" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="468" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="528" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="471" cy="245" r="2.8" fill="#fff"/>
      <circle cx="531" cy="243" r="2.8" fill="#fff"/>
      <path d="M465 288 Q495 308 525 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
