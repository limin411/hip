<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物鼓掌">
  <defs>
    <style>

      .player { animation: bob 0.45s ease-in-out infinite; transform-origin: 500px 500px; }
      .arm-l { animation: clap-l 0.45s ease-in-out infinite; transform-origin: 420px 400px; }
      .arm-r { animation: clap-r 0.45s ease-in-out infinite; transform-origin: 580px 400px; }
      .spark { animation: spark 0.45s ease-out infinite; }
      .head { animation: head 0.45s ease-in-out infinite; transform-origin: 500px 250px; }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes clap-l { 0%,100%{transform:rotate(-40deg)} 50%{transform:rotate(-5deg)} }
      @keyframes clap-r { 0%,100%{transform:rotate(40deg)} 50%{transform:rotate(5deg)} }
      @keyframes spark { 0%,40%{opacity:0} 50%{opacity:1;transform:scale(1.3)} 100%{opacity:0;transform:scale(1.6)} }
      @keyframes head { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="spark" fill="#f0c36a">
    <circle cx="500" cy="400" r="8"/><circle cx="480" cy="380" r="4"/><circle cx="520" cy="385" r="5"/>
  </g>
  <g class="player">
    <line x1="460" y1="600" x2="440" y2="820" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="540" y1="600" x2="560" y2="820" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="430" cy="838" rx="32" ry="15" fill="#5c4030"/><ellipse cx="570" cy="838" rx="32" ry="15" fill="#5c4030"/>
    <ellipse cx="500" cy="480" rx="95" ry="115" fill="url(#skin)"/>
    <path d="M415 390 C430 345 570 345 585 390 L595 550 C575 590 425 590 405 550 Z" fill="#e8a54b"/>
    <path d="M420 530 C440 585 560 585 580 530 L570 620 C530 645 470 645 430 620 Z" fill="#8a6a3a"/>
    <g class="arm-l"><line x1="420" y1="400" x2="460" y2="380" stroke="url(#skin2)" stroke-width="46" stroke-linecap="round"/><circle cx="475" cy="372" r="26" fill="#9faf8b"/></g>
    <g class="arm-r"><line x1="580" y1="400" x2="540" y2="380" stroke="#a8b994" stroke-width="46" stroke-linecap="round"/><circle cx="525" cy="372" r="26" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
