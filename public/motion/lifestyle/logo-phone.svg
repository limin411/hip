<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物玩手机">
  <defs>
    <style>

      .player{animation:bob 1.8s ease-in-out infinite;transform-origin:500px 520px}
      .thumb{animation:tap .6s ease-in-out infinite;transform-origin:560px 520px}
      .head{animation:h 1.8s ease-in-out infinite;transform-origin:500px 280px}
      .noti{animation:noti 2s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
      @keyframes h{0%,100%{transform:rotate(8deg) translateY(10px)}50%{transform:rotate(10deg) translateY(12px)}}
      @keyframes noti{0%,70%{opacity:0;transform:scale(.5)}80%{opacity:1;transform:scale(1.1)}100%{opacity:0}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <g class="noti" fill="#e85a5a"><circle cx="620" cy="380" r="14"/><text x="620" y="385" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui">1</text></g>
  <g class="player">
    <line x1="460" y1="620" x2="440" y2="800" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="540" y1="620" x2="560" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="430" cy="818" rx="30" ry="14" fill="#5c4030"/><ellipse cx="570" cy="818" rx="30" ry="14" fill="#5c4030"/>
    <ellipse cx="500" cy="500" rx="95" ry="115" fill="url(#skin)"/>
    <path d="M415 410 C430 365 570 365 585 410 L595 560 C575 600 425 600 405 560 Z" fill="#5b6bc0"/>
    <path d="M420 620 C450 700 550 700 580 620 L560 680 C530 720 470 720 440 680 Z" fill="#3a4a7a"/>
    <line x1="420" y1="440" x2="480" y2="540" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/>
    <g class="thumb">
      <line x1="560" y1="440" x2="560" y2="540" stroke="#a8b994" stroke-width="40" stroke-linecap="round"/>
      <circle cx="560" cy="555" r="22" fill="#9faf8b"/>
    </g>
    <!-- phone -->
    <rect x="500" y="480" width="70" height="120" rx="10" fill="#222"/>
    <rect x="508" y="495" width="54" height="90" rx="4" fill="#7ec4e0"/>
    
    <g class="head">
      <line x1="500" y1="350" x2="500" y2="320" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="270" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="200" x2="440" y2="158" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="198" x2="562" y2="156" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="153" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="152" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="290" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="288" r="15.0" fill="url(#blush)"/>
      <path d="M455 240 Q480 228 502 240" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 238 Q535 226 560 240" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="270" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="268" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="270" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="268" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="265" r="2.8" fill="#fff"/>
      <circle cx="541" cy="263" r="2.8" fill="#fff"/>
      <path d="M475 308 Q505 328 535 306" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="228" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
