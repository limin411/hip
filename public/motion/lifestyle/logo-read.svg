<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物看书">
  <defs>
    <style>

      .player { animation: breathe 2s ease-in-out infinite; transform-origin: 500px 550px; }
      .page { animation: page 3s ease-in-out infinite; transform-origin: 500px 520px; }
      .head { animation: head 2s ease-in-out infinite; transform-origin: 500px 260px; }
      @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes page { 0%,40%{transform:rotateY(0)} 50%{transform:rotateY(-25deg)} 60%,100%{transform:rotateY(0)} }
      @keyframes head { 0%,100%{transform:rotate(5deg) translateY(5px)} 50%{transform:rotate(8deg) translateY(8px)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<!-- chair hint -->
  <rect x="360" y="700" width="280" height="40" rx="10" fill="#8b6914" opacity="0.5"/>
  <g class="player">
    <line x1="450" y1="620" x2="420" y2="780" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="550" y1="620" x2="580" y2="780" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="410" cy="795" rx="30" ry="14" fill="#5c4030"/><ellipse cx="590" cy="795" rx="30" ry="14" fill="#5c4030"/>
    <ellipse cx="500" cy="500" rx="95" ry="115" fill="url(#skin)"/>
    <path d="M415 400 C430 355 570 355 585 400 L595 560 C575 600 425 600 405 560 Z" fill="#5a8f6a"/>
    <path d="M420 620 C450 700 550 700 580 620 L560 680 C530 720 470 720 440 680 Z" fill="#4a6a5a"/>
    <!-- book -->
    <g class="page">
      <path d="M380 480 L500 500 L500 620 L380 600 Z" fill="#f5f0e0" stroke="#c4a882" stroke-width="3"/>
      <path d="M620 480 L500 500 L500 620 L620 600 Z" fill="#fff8e8" stroke="#c4a882" stroke-width="3"/>
      <line x1="400" y1="520" x2="480" y2="530" stroke="#ccc" stroke-width="3"/>
      <line x1="400" y1="545" x2="480" y2="555" stroke="#ccc" stroke-width="3"/>
      <line x1="400" y1="570" x2="470" y2="578" stroke="#ccc" stroke-width="3"/>
      <line x1="520" y1="530" x2="600" y2="520" stroke="#ccc" stroke-width="3"/>
      <line x1="520" y1="555" x2="600" y2="545" stroke="#ccc" stroke-width="3"/>
    </g>
    <line x1="420" y1="430" x2="400" y2="520" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="395" cy="530" r="20" fill="#9faf8b"/>
    <line x1="580" y1="430" x2="600" y2="520" stroke="#a8b994" stroke-width="40" stroke-linecap="round"/>
    <circle cx="605" cy="530" r="20" fill="#9faf8b"/>
    
    <g class="head">
      <line x1="500" y1="340" x2="500" y2="310" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="260" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="190" x2="440" y2="148" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="188" x2="562" y2="146" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="143" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="142" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="280" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="278" r="15.0" fill="url(#blush)"/>
      <path d="M455 230 Q480 218 502 230" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 228 Q535 216 560 230" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="260" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="258" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="260" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="258" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="255" r="2.8" fill="#fff"/>
      <circle cx="541" cy="253" r="2.8" fill="#fff"/>
      <path d="M475 298 Q505 318 535 296" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="218" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
