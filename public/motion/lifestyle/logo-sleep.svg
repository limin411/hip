<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物睡觉">
  <defs>
    <style>

      .player { animation: breathe 2.5s ease-in-out infinite; transform-origin: 500px 600px; }
      .zzz1 { animation: zzz 2s ease-in-out infinite; }
      .zzz2 { animation: zzz 2s ease-in-out infinite 0.6s; }
      .zzz3 { animation: zzz 2s ease-in-out infinite 1.2s; }
      @keyframes breathe { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.02,0.98)} }
      @keyframes zzz { 0%{opacity:0;transform:translate(0,0) scale(.8)} 40%{opacity:1} 100%{opacity:0;transform:translate(30px,-40px) scale(1.2)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- bed -->
  <rect x="200" y="620" width="600" height="200" rx="30" fill="#7eb8d4" opacity="0.5"/>
  <rect x="220" y="580" width="120" height="80" rx="20" fill="#f5f0e0"/>
<g class="zzz1" font-family="system-ui" font-size="48" font-weight="700" fill="#6a9ac4"><text x="620" y="350">Z</text></g>
  <g class="zzz2" font-family="system-ui" font-size="36" font-weight="700" fill="#8ab4d4"><text x="670" y="300">z</text></g>
  <g class="zzz3" font-family="system-ui" font-size="28" font-weight="700" fill="#a8cce0"><text x="710" y="260">z</text></g>
  <g class="player">
    <!-- lying body -->
    <ellipse cx="480" cy="680" rx="160" ry="70" fill="url(#skin)" transform="rotate(-8 480 680)"/>
    <ellipse cx="620" cy="620" rx="75" ry="75" fill="url(#skin)"/>
    <!-- closed eyes as arcs -->
    <path d="M590 610 Q605 620 620 610" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <path d="M635 608 Q650 618 665 608" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="580" cy="635" r="12" fill="url(#blush)"/>
    <circle cx="670" cy="630" r="12" fill="url(#blush)"/>
    <path d="M610 650 Q635 665 655 648" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <!-- antennae -->
    <line x1="590" y1="560" x2="575" y2="520" stroke="#9faf8b" stroke-width="12" stroke-linecap="round"/>
    <line x1="650" y1="555" x2="670" y2="515" stroke="#9faf8b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="572" cy="515" r="9" fill="#9faf8b"/><circle cx="673" cy="510" r="9" fill="#9faf8b"/>
    <!-- blanket -->
    <path d="M320 660 Q480 700 600 650 L590 780 Q450 820 330 780 Z" fill="#5b8fd4" opacity="0.75"/>
  </g>

</svg>
