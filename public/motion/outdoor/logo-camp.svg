<svg viewBox="0 0 1100 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物露营">
  <defs>
    <style>

      .player{animation:bob 2s ease-in-out infinite;transform-origin:450px 550px}
      .fire{animation:flicker .4s ease-in-out infinite}
      .spark{animation:spark .8s ease-out infinite}
      .head{animation:h 2s ease-in-out infinite;transform-origin:450px 280px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes flicker{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15) scaleX(.95)}}
      @keyframes spark{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
      @keyframes h{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <!-- tent -->
  <path d="M650 850 L850 500 L1050 850 Z" fill="#5bb8d4" opacity="0.7"/>
  <path d="M850 500 L850 850" stroke="#3a8ab0" stroke-width="4"/>
  <!-- fire -->
  <g class="fire" transform-origin="320px 780px">
    <ellipse cx="320" cy="820" rx="50" ry="15" fill="#5c4030"/>
    <path d="M290 800 Q320 700 350 800 Q320 760 290 800" fill="#e07a3a"/>
    <path d="M305 800 Q320 730 335 800" fill="#f0c36a"/>
  </g>
  <g class="spark" fill="#f0c36a"><circle cx="310" cy="720" r="4"/><circle cx="340" cy="700" r="3"/></g>
  <g class="player">
    <line x1="420" y1="620" x2="400" y2="800" stroke="url(#skin2)" stroke-width="46" stroke-linecap="round"/>
    <line x1="500" y1="620" x2="530" y2="800" stroke="url(#skin)" stroke-width="46" stroke-linecap="round"/>
    <ellipse cx="390" cy="815" rx="28" ry="14" fill="#5c4030"/><ellipse cx="540" cy="815" rx="28" ry="14" fill="#5c4030"/>
    <ellipse cx="460" cy="520" rx="85" ry="100" fill="url(#skin)"/>
    <path d="M390 440 C405 400 520 400 535 440 L545 580 C525 615 395 615 375 580 Z" fill="#6a8a5a"/>
    <line x1="400" y1="450" x2="340" y2="580" stroke="url(#skin2)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="330" cy="595" r="22" fill="#9faf8b"/>
    <line x1="520" y1="450" x2="580" y2="560" stroke="#a8b994" stroke-width="40" stroke-linecap="round"/>
    <circle cx="590" cy="572" r="22" fill="#9faf8b"/>
    
    <g class="head">
      <line x1="450" y1="360" x2="450" y2="330" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="450" cy="280" r="88.0" fill="url(#skin)"/>
      <line x1="410" y1="210" x2="390" y2="168" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="490" y1="208" x2="512" y2="166" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="387" cy="163" r="11.0" fill="#9faf8b"/>
      <circle cx="515" cy="162" r="11.0" fill="#9faf8b"/>
      <circle cx="405" cy="300" r="16.0" fill="url(#blush)"/>
      <circle cx="500" cy="298" r="15.0" fill="url(#blush)"/>
      <path d="M405 250 Q430 238 452 250" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M462 248 Q485 236 510 250" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="425" cy="280" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="485" cy="278" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="428" cy="280" r="8.5" fill="#1a1a1a"/>
      <circle cx="488" cy="278" r="8.5" fill="#1a1a1a"/>
      <circle cx="431" cy="275" r="2.8" fill="#fff"/>
      <circle cx="491" cy="273" r="2.8" fill="#fff"/>
      <path d="M425 318 Q455 338 485 316" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="425" cy="238" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
