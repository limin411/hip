<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物钓鱼">
  <defs>
    <style>

      .player{animation:bob 2s ease-in-out infinite;transform-origin:400px 500px}
      .line{animation:line 2s ease-in-out infinite}
      .fish{animation:fish 2s ease-in-out infinite}
      .head{animation:h 2s ease-in-out infinite;transform-origin:400px 250px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes line{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
      @keyframes fish{0%,60%{transform:translate(0,0);opacity:0}80%{opacity:1;transform:translate(-20px,-40px)}100%{opacity:0}}
      @keyframes h{0%,100%{transform:rotate(5deg)}50%{transform:rotate(8deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <path d="M500 700 Q700 750 900 720 L900 950 L500 950 Z" fill="#7ec4e0" opacity="0.35"/>
  <g class="player">
    <line x1="380" y1="580" x2="360" y2="800" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="450" y1="580" x2="490" y2="790" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="350" cy="818" rx="30" ry="14" fill="#5c4030"/><ellipse cx="505" cy="805" rx="30" ry="14" fill="#5c4030"/>
    <ellipse cx="410" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M330 390 C345 345 475 345 490 390 L500 540 C480 580 340 580 320 540 Z" fill="#4a8fd4"/>
    <path d="M335 520 C350 575 470 575 485 520 L475 600 C440 620 380 620 345 600 Z" fill="#2a5a8a"/>
    <line x1="350" y1="400" x2="320" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="312" cy="535" r="22" fill="#9faf8b"/>
    <g class="line" transform-origin="480px 400px">
      <line x1="480" y1="400" x2="560" y2="360" stroke="#a8b994" stroke-width="42" stroke-linecap="round"/>
      <circle cx="572" cy="350" r="22" fill="#9faf8b"/>
      <line x1="572" y1="350" x2="780" y2="200" stroke="#8b6914" stroke-width="8"/>
      <line x1="780" y1="200" x2="780" y2="700" stroke="#aaa" stroke-width="2"/>
      <circle cx="780" cy="710" r="6" fill="#555"/>
    </g>
    <g class="fish">
      <ellipse cx="800" cy="720" rx="28" ry="16" fill="#e07a3a"/>
      <path d="M828 720 L850 705 L850 735 Z" fill="#c45c22"/>
    </g>
    
    <g class="head">
      <line x1="400" y1="330" x2="400" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="400" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="360" y1="180" x2="340" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="440" y1="178" x2="462" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="337" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="465" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="355" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="450" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M355 220 Q380 208 402 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M412 218 Q435 206 460 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="375" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="435" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="378" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="438" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="381" cy="245" r="2.8" fill="#fff"/>
      <circle cx="441" cy="243" r="2.8" fill="#fff"/>
      <path d="M375 288 Q405 308 435 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="375" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
