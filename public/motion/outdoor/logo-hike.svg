<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物徒步">
  <defs>
    <style>

      .player{animation:walk .7s ease-in-out infinite;transform-origin:500px 500px}
      .leg-l{animation:ll .7s ease-in-out infinite;transform-origin:460px 580px}
      .leg-r{animation:lr .7s ease-in-out infinite;transform-origin:540px 580px}
      .arm-l{animation:al .7s ease-in-out infinite;transform-origin:420px 400px}
      .arm-r{animation:ar .7s ease-in-out infinite;transform-origin:580px 400px}
      .head{animation:h .7s ease-in-out infinite;transform-origin:500px 250px}
      @keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes ll{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
      @keyframes lr{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
      @keyframes al{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
      @keyframes ar{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
      @keyframes h{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <g class="player">
    <g class="leg-l"><line x1="460" y1="580" x2="420" y2="800" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="410" cy="818" rx="32" ry="16" fill="#5c4030"/></g>
    <g class="leg-r"><line x1="540" y1="580" x2="590" y2="790" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="605" cy="805" rx="32" ry="16" fill="#5c4030"/></g>
    <ellipse cx="500" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M420 390 C435 345 565 345 580 390 L590 540 C570 580 430 580 410 540 Z" fill="#6a8a5a"/>
    <path d="M425 520 C440 575 560 575 575 520 L565 610 C530 630 470 630 435 610 Z" fill="#4a6a3a"/>
    <!-- backpack -->
    <rect x="540" y="420" width="70" height="90" rx="12" fill="#c45c5c"/>
    <rect x="555" y="400" width="40" height="25" rx="6" fill="#8b3a3a"/>
    <g class="arm-l"><line x1="420" y1="400" x2="340" y2="560" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/><circle cx="330" cy="575" r="24" fill="#9faf8b"/>
      <line x1="330" y1="575" x2="300" y2="750" stroke="#8b6914" stroke-width="10" stroke-linecap="round"/></g>
    <g class="arm-r"><line x1="580" y1="400" x2="660" y2="520" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/><circle cx="672" cy="530" r="24" fill="#9faf8b"/></g>
    <ellipse cx="500" cy="185" rx="70" ry="30" fill="#4a6a3a"/>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
