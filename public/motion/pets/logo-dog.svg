<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物遛狗">
  <defs>
    <style>

      .player{animation:walk .6s ease-in-out infinite;transform-origin:420px 500px}
      .leg-l{animation:ll .6s ease-in-out infinite;transform-origin:400px 580px}
      .leg-r{animation:lr .6s ease-in-out infinite;transform-origin:460px 580px}
      .dog{animation:dog .6s ease-in-out infinite;transform-origin:700px 750px}
      .tail{animation:tail .3s ease-in-out infinite;transform-origin:760px 740px}
      .head{animation:h .6s ease-in-out infinite;transform-origin:420px 250px}
      @keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes ll{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
      @keyframes lr{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
      @keyframes dog{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes tail{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(25deg)}}
      @keyframes h{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <line x1="500" y1="480" x2="680" y2="700" stroke="#8b6914" stroke-width="4"/>
  <g class="dog">
    <ellipse cx="720" cy="780" rx="55" ry="35" fill="#c4a060"/>
    <circle cx="670" cy="760" r="28" fill="#c4a060"/>
    <ellipse cx="655" cy="755" rx="8" ry="12" fill="#a08040"/>
    <circle cx="662" cy="758" r="4" fill="#1a1a1a"/>
    <g class="tail"><path d="M770 760 Q800 730 790 700" fill="none" stroke="#c4a060" stroke-width="14" stroke-linecap="round"/></g>
    <ellipse cx="700" cy="810" rx="10" ry="16" fill="#a08040"/><ellipse cx="740" cy="810" rx="10" ry="16" fill="#a08040"/>
  </g>
  <g class="player">
    <g class="leg-l"><line x1="400" y1="580" x2="370" y2="800" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="360" cy="818" rx="30" ry="14" fill="#5c4030"/></g>
    <g class="leg-r"><line x1="460" y1="580" x2="500" y2="790" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="515" cy="805" rx="30" ry="14" fill="#5c4030"/></g>
    <ellipse cx="430" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M350 390 C365 345 495 345 510 390 L520 540 C500 580 360 580 340 540 Z" fill="#e07a3a"/>
    <path d="M355 520 C370 575 490 575 505 520 L495 600 C460 620 400 620 365 600 Z" fill="#2f4a5c"/>
    <line x1="370" y1="400" x2="330" y2="540" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="320" cy="555" r="22" fill="#9faf8b"/>
    <line x1="500" y1="400" x2="560" y2="480" stroke="#a8b994" stroke-width="42" stroke-linecap="round"/>
    <circle cx="570" cy="490" r="22" fill="#9faf8b"/>
    
    <g class="head">
      <line x1="420" y1="330" x2="420" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="420" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="380" y1="180" x2="360" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="460" y1="178" x2="482" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="357" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="485" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="375" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="470" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M375 220 Q400 208 422 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M432 218 Q455 206 480 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="395" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="455" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="398" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="458" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="401" cy="245" r="2.8" fill="#fff"/>
      <circle cx="461" cy="243" r="2.8" fill="#fff"/>
      <path d="M395 288 Q425 308 455 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="395" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
