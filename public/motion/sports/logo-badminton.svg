<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物打羽毛球">
  <defs>
    <style>

      .player{animation:bob .7s ease-in-out infinite;transform-origin:480px 500px}
      .arm{animation:swing .7s ease-in-out infinite;transform-origin:540px 400px}
      .shuttle{animation:fly .7s ease-in-out infinite}
      .head{animation:h .7s ease-in-out infinite;transform-origin:490px 250px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes swing{0%,100%{transform:rotate(30deg)}45%{transform:rotate(-50deg)}}
      @keyframes fly{0%{transform:translate(0,20px)}45%{transform:translate(100px,-90px)}100%{transform:translate(0,20px)}}
      @keyframes h{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <g class="shuttle">
    <ellipse cx="680" cy="320" rx="14" ry="18" fill="#f5f0e0" stroke="#c4a882" stroke-width="2"/>
    <path d="M680 338 L665 370 L680 360 L695 370 Z" fill="#eee" stroke="#bbb" stroke-width="1.5"/>
  </g>
  <g class="player">
    <line x1="450" y1="580" x2="410" y2="810" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="520" y1="580" x2="570" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="400" cy="828" rx="30" ry="14" fill="#fff"/><ellipse cx="585" cy="815" rx="30" ry="14" fill="#fff"/>
    <ellipse cx="480" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 345 545 345 560 390 L570 540 C550 580 410 580 390 540 Z" fill="#4a9e6a"/>
    <path d="M405 520 C420 575 540 575 555 520 L545 600 C510 620 450 620 415 600 Z" fill="#2a5a3a"/>
    <line x1="420" y1="400" x2="360" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="350" cy="535" r="22" fill="#9faf8b"/>
    <g class="arm">
      <line x1="540" y1="400" x2="640" y2="480" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/>
      <circle cx="652" cy="490" r="22" fill="#9faf8b"/>
      <line x1="652" y1="490" x2="720" y2="540" stroke="#8b6914" stroke-width="8"/>
      <ellipse cx="750" cy="560" rx="36" ry="48" fill="none" stroke="#333" stroke-width="7" transform="rotate(25 750 560)"/>
      <path d="M730 530 L770 590 M770 530 L730 590" fill="none" stroke="#aaa" stroke-width="2" transform="rotate(25 750 560)"/>
    </g>
    
    <g class="head">
      <line x1="490" y1="330" x2="490" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="490" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="450" y1="180" x2="430" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="530" y1="178" x2="552" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="427" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="555" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="445" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="540" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M445 220 Q470 208 492 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M502 218 Q525 206 550 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="525" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="468" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="528" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="471" cy="245" r="2.8" fill="#fff"/>
      <circle cx="531" cy="243" r="2.8" fill="#fff"/>
      <path d="M465 288 Q495 308 525 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
