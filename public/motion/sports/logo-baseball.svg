<svg viewBox="0 0 1100 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物打棒球">
  <defs>
    <style>

      .player { animation: bob 1.1s ease-in-out infinite; transform-origin: 480px 500px; }
      .arm-bat { animation: swing 1.1s ease-in-out infinite; transform-origin: 520px 400px; }
      .ball { animation: ball 1.1s ease-in-out infinite; }
      .leg-l { animation: ll 1.1s ease-in-out infinite; transform-origin: 440px 580px; }
      .leg-r { animation: lr 1.1s ease-in-out infinite; transform-origin: 520px 580px; }
      .head { animation: head 1.1s ease-in-out infinite; transform-origin: 500px 250px; }
      @keyframes bob { 0%,30%{transform:rotate(-8deg)} 55%{transform:rotate(8deg)} 100%{transform:rotate(-8deg)} }
      @keyframes swing { 0%,25%{transform:rotate(50deg)} 55%{transform:rotate(-100deg)} 100%{transform:rotate(50deg)} }
      @keyframes ball { 0%,40%{transform:translate(0,0);opacity:1} 70%{transform:translate(200px,-40px);opacity:1} 85%{opacity:0} 100%{transform:translate(0,0);opacity:0} }
      @keyframes ll { 0%,100%{transform:rotate(15deg)} 55%{transform:rotate(-5deg)} }
      @keyframes lr { 0%,100%{transform:rotate(-5deg)} 55%{transform:rotate(10deg)} }
      @keyframes head { 0%,30%{transform:rotate(-8deg)} 55%{transform:rotate(12deg)} 100%{transform:rotate(-8deg)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="ball"><circle cx="700" cy="450" r="20" fill="#f5f0e0" stroke="#c4a882" stroke-width="2"/>
    <path d="M690 440 Q700 450 690 460 M710 440 Q700 450 710 460" fill="none" stroke="#c45c5c" stroke-width="2"/></g>
  <g class="player">
    <g class="leg-l"><line x1="440" y1="580" x2="400" y2="810" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="390" cy="828" rx="32" ry="15" fill="#222"/></g>
    <g class="leg-r"><line x1="520" y1="580" x2="580" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="595" cy="815" rx="32" ry="15" fill="#222"/></g>
    <ellipse cx="480" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 345 545 345 560 390 L570 540 C550 580 410 580 390 540 Z" fill="#e8e8e8"/>
    <path d="M405 520 C420 575 540 575 555 520 L545 600 C510 620 450 620 415 600 Z" fill="#2a4a7a"/>
    <line x1="420" y1="400" x2="360" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="350" cy="535" r="24" fill="#9faf8b"/>
    <g class="arm-bat">
      <line x1="520" y1="400" x2="600" y2="500" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/>
      <circle cx="610" cy="512" r="24" fill="#9faf8b"/>
      <line x1="610" y1="512" x2="750" y2="420" stroke="#c4a060" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="770" cy="405" rx="18" ry="28" fill="#d4b070" transform="rotate(-30 770 405)"/>
    </g>
    <!-- cap -->
    <ellipse cx="500" cy="195" rx="70" ry="28" fill="#2a4a7a"/>
    <path d="M430 200 Q500 160 570 200" fill="#2a4a7a"/>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
