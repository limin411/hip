<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物打篮球动画">
  <defs>
    <style>
      .player {
        animation: body-bob 0.7s ease-in-out infinite;
        transform-origin: 480px 480px;
      }
      .head {
        animation: head-bob 0.7s ease-in-out infinite;
        transform-origin: 480px 230px;
      }
      .arm-dribble {
        animation: dribble-arm 0.7s ease-in-out infinite;
        transform-origin: 560px 360px;
      }
      .arm-guard {
        animation: guard-arm 0.7s ease-in-out infinite;
        transform-origin: 400px 360px;
      }
      .leg-l {
        animation: step-l 0.7s ease-in-out infinite;
        transform-origin: 440px 520px;
      }
      .leg-r {
        animation: step-r 0.7s ease-in-out infinite;
        transform-origin: 520px 520px;
      }
      .ball {
        animation: ball-bounce 0.7s cubic-bezier(0.4, 0, 0.45, 1) infinite;
      }
      .squash {
        animation: ball-squash 0.7s cubic-bezier(0.4, 0, 0.45, 1) infinite;
        transform-origin: 620px 720px;
      }

      @keyframes body-bob {
        0%, 100% { transform: translate(0, 0) rotate(1deg); }
        45% { transform: translate(0, 10px) rotate(-1deg); }
        55% { transform: translate(0, 12px) rotate(-1deg); }
      }
      @keyframes head-bob {
        0%, 100% { transform: translate(0, 0) rotate(-2deg); }
        50% { transform: translate(0, 6px) rotate(2deg); }
      }
      /* 运球手：随球上下 */
      @keyframes dribble-arm {
        0%, 100% { transform: rotate(25deg); }
        45% { transform: rotate(55deg); }
        55% { transform: rotate(58deg); }
      }
      @keyframes guard-arm {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(-28deg); }
      }
      @keyframes step-l {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes step-r {
        0%, 100% { transform: rotate(8deg); }
        50% { transform: rotate(-6deg); }
      }
      /* 球：手边高点 → 落地 → 回弹到手 */
      @keyframes ball-bounce {
        0%, 100% {
          transform: translate(0, 0);
        }
        48% {
          transform: translate(8px, 175px);
        }
        52% {
          transform: translate(8px, 178px);
        }
      }
      @keyframes ball-squash {
        0%, 100% { transform: scale(1, 1); }
        45% { transform: scale(1, 1); }
        50% { transform: scale(1.12, 0.82); }
        58% { transform: scale(0.95, 1.06); }
        70% { transform: scale(1, 1); }
      }
    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e07a3a"/>
      <stop offset="100%" stop-color="#c45e22"/>
    </linearGradient>
    <linearGradient id="ballOr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a060"/>
      <stop offset="50%" stop-color="#e07a3a"/>
      <stop offset="100%" stop-color="#c45e22"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 脚底轻影 -->
<!-- 球落地点轻影 -->
<g class="player">
    <!-- 左腿 -->
    <g class="leg-l">
      <line x1="440" y1="520" x2="400" y2="710" stroke="url(#skin2)" stroke-width="50" stroke-linecap="round"/>
      <ellipse cx="390" cy="728" rx="34" ry="18" fill="#2a2a2a" transform="rotate(-10 390 728)"/>
    </g>
    <!-- 右腿 -->
    <g class="leg-r">
      <line x1="520" y1="520" x2="560" y2="705" stroke="url(#skin)" stroke-width="50" stroke-linecap="round"/>
      <ellipse cx="575" cy="722" rx="34" ry="18" fill="#2a2a2a" transform="rotate(12 575 722)"/>
    </g>

    <!-- 躯干 -->
    <g>
      <ellipse cx="480" cy="430" rx="100" ry="118" fill="url(#skin)"/>
      <!-- 球衣 -->
      <path d="M395 350
               C 410 305, 550 305, 565 350
               L 575 505
               C 560 540, 400 540, 385 505 Z"
            fill="url(#jersey)"/>
      <!-- 号码点缀 -->
      <text x="480" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#fff" opacity="0.85">8</text>
      <!-- 短裤 -->
      <path d="M395 495 C 410 555, 550 555, 565 495 L 555 575 C 520 595, 440 595, 405 575 Z"
            fill="#2f4a5c"/>
    </g>

    <!-- 护球/平衡臂 -->
    <g class="arm-guard">
      <line x1="400" y1="360" x2="300" y2="300" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/>
      <circle cx="285" cy="288" r="26" fill="#9faf8b"/>
    </g>

    <!-- 运球臂 -->
    <g class="arm-dribble">
      <line x1="560" y1="360" x2="620" y2="480" stroke="#a8b994" stroke-width="46" stroke-linecap="round"/>
      <circle cx="632" cy="500" r="26" fill="#9faf8b"/>
    </g>

    <!-- 头 -->
    <g class="head">
      <line x1="480" y1="330" x2="480" y2="280" stroke="#9faf8b" stroke-width="36" stroke-linecap="round"/>
      <circle cx="480" cy="220" r="90" fill="url(#skin)"/>
      <!-- 触角 -->
      <line x1="440" y1="150" x2="420" y2="108" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <line x1="520" y1="148" x2="542" y2="106" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <circle cx="417" cy="103" r="11" fill="#9faf8b"/>
      <circle cx="545" cy="102" r="11" fill="#9faf8b"/>
      <!-- 腮红 -->
      <circle cx="435" cy="240" r="17" fill="url(#blush)"/>
      <circle cx="530" cy="238" r="16" fill="url(#blush)"/>
      <!-- 眉（专注） -->
      <path d="M435 190 Q460 178 482 190" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <path d="M495 188 Q520 176 545 190" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <!-- 眼 -->
      <ellipse cx="455" cy="220" rx="22" ry="20" fill="#fff"/>
      <ellipse cx="515" cy="218" rx="22" ry="20" fill="#fff"/>
      <circle cx="460" cy="222" r="9" fill="#1a1a1a"/>
      <circle cx="520" cy="220" r="9" fill="#1a1a1a"/>
      <circle cx="463" cy="217" r="3" fill="#fff"/>
      <circle cx="523" cy="215" r="3" fill="#fff"/>
      <!-- 嘴 -->
      <path d="M458 260 Q485 278 512 258" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="460" cy="180" rx="20" ry="11" fill="#fff" opacity="0.28"/>
    </g>
  </g>

  <!-- 篮球：bounce + 落地压扁 -->
  <g class="ball">
    <g class="squash">
      <circle cx="620" cy="545" r="40" fill="url(#ballOr)" stroke="#a04a18" stroke-width="2.5"/>
      <!-- 球纹 -->
      <path d="M620 505 Q640 545 620 585 Q600 545 620 505" fill="none" stroke="#8b3f14" stroke-width="2.5"/>
      <path d="M585 530 Q620 545 655 530" fill="none" stroke="#8b3f14" stroke-width="2.5"/>
      <path d="M585 560 Q620 545 655 560" fill="none" stroke="#8b3f14" stroke-width="2.5"/>
      <ellipse cx="608" cy="530" rx="8" ry="5" fill="#fff" opacity="0.25"/>
    </g>
  </g>
</svg>
