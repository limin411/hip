<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物保龄球">
  <defs>
    <style>

      .player{animation:throw 1.2s ease-in-out infinite;transform-origin:450px 500px}
      .arm{animation:arm 1.2s ease-in-out infinite;transform-origin:520px 400px}
      .ball{animation:ball 1.2s ease-in-out infinite}
      .pin{animation:pin 1.2s ease-in-out infinite}
      .head{animation:h 1.2s ease-in-out infinite;transform-origin:470px 250px}
      @keyframes throw{0%,30%{transform:rotate(-5deg)}55%{transform:rotate(8deg)}100%{transform:rotate(-5deg)}}
      @keyframes arm{0%,25%{transform:rotate(40deg)}55%{transform:rotate(-30deg)}100%{transform:rotate(40deg)}}
      @keyframes ball{0%,40%{transform:translate(0,0)}80%{transform:translate(200px,40px)}100%{transform:translate(200px,40px);opacity:0}}
      @keyframes pin{0%,70%{transform:rotate(0)}85%{transform:rotate(25deg) translate(20px,-10px)}100%{transform:rotate(40deg);opacity:.3}}
      @keyframes h{0%,30%{transform:rotate(-5deg)}55%{transform:rotate(8deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <g class="pin">
    <ellipse cx="780" cy="820" rx="22" ry="12" fill="#ddd"/>
    <path d="M760 820 Q780 700 800 820" fill="#f5f0e0" stroke="#ccc" stroke-width="2"/>
    <rect x="768" y="740" width="24" height="20" rx="4" fill="#e85a5a"/>
  </g>
  <g class="ball"><circle cx="600" cy="780" r="36" fill="#5b3a8a"/><circle cx="588" cy="768" r="6" fill="#333"/><circle cx="605" cy="760" r="6" fill="#333"/><circle cx="612" cy="778" r="6" fill="#333"/></g>
  <g class="player">
    <line x1="430" y1="580" x2="400" y2="810" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="510" y1="580" x2="560" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="390" cy="828" rx="30" ry="14" fill="#222"/><ellipse cx="575" cy="815" rx="30" ry="14" fill="#222"/>
    <ellipse cx="470" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M390 390 C405 345 535 345 550 390 L560 540 C540 580 400 580 380 540 Z" fill="#3a6a9a"/>
    <path d="M395 520 C410 575 530 575 545 520 L535 600 C500 620 440 620 405 600 Z" fill="#2a4a6a"/>
    <line x1="410" y1="400" x2="360" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="350" cy="535" r="22" fill="#9faf8b"/>
    <g class="arm"><line x1="520" y1="400" x2="600" y2="720" stroke="#a8b994" stroke-width="46" stroke-linecap="round"/><circle cx="608" cy="740" r="26" fill="#9faf8b"/></g>
    
    <g class="head">
      <line x1="470" y1="330" x2="470" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="470" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="430" y1="180" x2="410" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="510" y1="178" x2="532" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="407" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="535" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="425" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="520" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M425 220 Q450 208 472 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M482 218 Q505 206 530 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="445" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="505" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="448" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="508" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="451" cy="245" r="2.8" fill="#fff"/>
      <circle cx="511" cy="243" r="2.8" fill="#fff"/>
      <path d="M445 288 Q475 308 505 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="445" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
