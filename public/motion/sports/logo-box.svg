<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物拳击">
  <defs>
    <style>

      .player { animation: bob 0.7s ease-in-out infinite; transform-origin: 480px 500px; }
      .arm-jab { animation: jab 0.7s ease-in-out infinite; transform-origin: 520px 400px; }
      .arm-guard { animation: guard 0.7s ease-in-out infinite; transform-origin: 420px 400px; }
      .leg-l { animation: ll 0.7s ease-in-out infinite; transform-origin: 450px 580px; }
      .leg-r { animation: lr 0.7s ease-in-out infinite; transform-origin: 520px 580px; }
      .head { animation: head 0.7s ease-in-out infinite; transform-origin: 500px 250px; }
      .whoosh { animation: whoosh 0.7s ease-out infinite; }
      @keyframes bob { 0%,100%{transform:translate(0,0)} 50%{transform:translate(8px,-8px)} }
      @keyframes jab { 0%,100%{transform:rotate(-10deg) scaleX(1)} 40%{transform:rotate(5deg) scaleX(1.15) translate(40px,0)} 60%{transform:rotate(-5deg)} }
      @keyframes guard { 0%,100%{transform:rotate(20deg)} 50%{transform:rotate(30deg)} }
      @keyframes ll { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(5deg)} }
      @keyframes lr { 0%,100%{transform:rotate(10deg)} 50%{transform:rotate(-5deg)} }
      @keyframes head { 0%,100%{transform:rotate(-4deg)} 40%{transform:rotate(6deg)} }
      @keyframes whoosh { 0%,35%{opacity:0} 45%{opacity:.5} 70%{opacity:0;transform:translate(50px,0)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="whoosh" fill="none" stroke="#e07a3a" stroke-width="6" stroke-linecap="round" opacity="0">
    <path d="M700 380 Q760 370 800 390"/><path d="M710 410 Q770 400 820 420"/>
  </g>
  <g class="player">
    <g class="leg-l"><line x1="450" y1="580" x2="410" y2="800" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="400" cy="818" rx="32" ry="15" fill="#c45c5c"/></g>
    <g class="leg-r"><line x1="520" y1="580" x2="580" y2="790" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="595" cy="805" rx="32" ry="15" fill="#c45c5c"/></g>
    <ellipse cx="480" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 345 545 345 560 390 L570 540 C550 580 410 580 390 540 Z" fill="#2a2a2a"/>
    <path d="M405 520 C420 575 540 575 555 520 L545 600 C510 620 450 620 415 600 Z" fill="#1a1a1a"/>
    <g class="arm-guard">
      <line x1="420" y1="400" x2="360" y2="320" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/>
      <ellipse cx="348" cy="300" rx="32" ry="28" fill="#c45c5c"/>
    </g>
    <g class="arm-jab">
      <line x1="520" y1="400" x2="680" y2="380" stroke="#a8b994" stroke-width="46" stroke-linecap="round"/>
      <ellipse cx="705" cy="375" rx="34" ry="30" fill="#c45c5c"/>
    </g>
    
    <g class="head">
      <line x1="500" y1="330" x2="500" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="180" x2="440" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="178" x2="562" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M455 220 Q480 208 502 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 218 Q535 206 560 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="245" r="2.8" fill="#fff"/>
      <circle cx="541" cy="243" r="2.8" fill="#fff"/>
      <path d="M475 288 Q505 308 535 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
