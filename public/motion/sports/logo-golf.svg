<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物打高尔夫">
  <defs>
    <style>

      .player { animation: bob 1.3s ease-in-out infinite; transform-origin: 480px 500px; }
      .arm-swing { animation: swing 1.3s ease-in-out infinite; transform-origin: 520px 400px; }
      .ball { animation: ball 1.3s ease-in-out infinite; }
      .head { animation: head 1.3s ease-in-out infinite; transform-origin: 490px 250px; }
      @keyframes bob { 0%,30%{transform:rotate(-5deg)} 55%{transform:rotate(5deg)} 100%{transform:rotate(-5deg)} }
      @keyframes swing { 0%,25%{transform:rotate(45deg)} 55%{transform:rotate(-70deg)} 100%{transform:rotate(45deg)} }
      @keyframes ball { 0%,50%{transform:translate(0,0);opacity:1} 80%{transform:translate(160px,-100px);opacity:1} 95%{opacity:0} 100%{opacity:0;transform:translate(0,0)} }
      @keyframes head { 0%,30%{transform:rotate(-5deg)} 55%{transform:rotate(8deg)} 100%{transform:rotate(-5deg)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<ellipse cx="620" cy="860" rx="40" ry="10" fill="#5a9e4a" opacity="0.4"/>
  <g class="ball"><circle cx="600" cy="840" r="14" fill="#fff" stroke="#ddd" stroke-width="2"/></g>
  <g class="player">
    <line x1="450" y1="600" x2="420" y2="820" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
    <line x1="520" y1="600" x2="580" y2="810" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
    <ellipse cx="410" cy="838" rx="32" ry="15" fill="#fff"/><ellipse cx="595" cy="825" rx="32" ry="15" fill="#fff"/>
    <ellipse cx="480" cy="480" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M400 390 C415 345 545 345 560 390 L570 540 C550 580 410 580 390 540 Z" fill="#fff"/>
    <path d="M405 520 C420 575 540 575 555 520 L545 610 C510 630 450 630 415 610 Z" fill="#2a5a3a"/>
    <line x1="420" y1="400" x2="380" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="370" cy="535" r="22" fill="#9faf8b"/>
    <g class="arm-swing">
      <line x1="520" y1="400" x2="580" y2="520" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/>
      <circle cx="590" cy="535" r="24" fill="#9faf8b"/>
      <line x1="590" y1="535" x2="640" y2="780" stroke="#555" stroke-width="10" stroke-linecap="round"/>
      <path d="M625 780 L660 790 L630 800 Z" fill="#333"/>
    </g>
    <!-- visor cap -->
    <ellipse cx="490" cy="185" rx="70" ry="28" fill="#fff"/>
    <path d="M520 195 L600 210 L520 215 Z" fill="#fff"/>
    
    <g class="head">
      <line x1="490" y1="330" x2="490" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="490" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="450" y1="180" x2="430" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="530" y1="178" x2="552" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="427" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="555" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="445" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="540" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M445 220 Q470 208 492 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M502 218 Q525 206 550 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="525" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="468" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="528" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="471" cy="245" r="2.8" fill="#fff"/>
      <circle cx="531" cy="243" r="2.8" fill="#fff"/>
      <path d="M465 288 Q495 308 525 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="465" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
