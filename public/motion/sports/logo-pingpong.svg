<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物打乒乓球">
  <defs>
    <style>

      .player { animation: bob 0.55s ease-in-out infinite; transform-origin: 450px 500px; }
      .arm-r { animation: swing 0.55s ease-in-out infinite; transform-origin: 520px 400px; }
      .ball { animation: ball 0.55s ease-in-out infinite; }
      .leg-l { animation: ll 0.55s ease-in-out infinite; transform-origin: 420px 580px; }
      .leg-r { animation: lr 0.55s ease-in-out infinite; transform-origin: 500px 580px; }
      .head { animation: head 0.55s ease-in-out infinite; transform-origin: 470px 250px; }
      @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-10px) rotate(2deg)} }
      @keyframes swing { 0%,100%{transform:rotate(25deg)} 50%{transform:rotate(-35deg)} }
      @keyframes ball { 0%{transform:translate(0,0)} 50%{transform:translate(120px,-60px)} 100%{transform:translate(0,0)} }
      @keyframes ll { 0%,100%{transform:rotate(8deg)} 50%{transform:rotate(-8deg)} }
      @keyframes lr { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
      @keyframes head { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(6deg)} }

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>

  </defs>
<g class="ball"><circle cx="620" cy="400" r="12" fill="#f0c36a" stroke="#c49a3a" stroke-width="2"/></g>
  <g class="player">
    <g class="leg-l"><line x1="420" y1="580" x2="390" y2="810" stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="380" cy="828" rx="32" ry="15" fill="#fff"/></g>
    <g class="leg-r"><line x1="500" y1="580" x2="550" y2="800" stroke="url(#skin)" stroke-width="48" stroke-linecap="round"/>
      <ellipse cx="565" cy="815" rx="32" ry="15" fill="#fff"/></g>
    <ellipse cx="460" cy="470" rx="90" ry="110" fill="url(#skin)"/>
    <path d="M380 390 C395 345 525 345 540 390 L550 540 C530 580 390 580 370 540 Z" fill="#e85a5a"/>
    <path d="M385 520 C400 575 520 575 535 520 L525 600 C490 620 430 620 395 600 Z" fill="#2a4a6a"/>
    <line x1="400" y1="400" x2="350" y2="520" stroke="url(#skin2)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="340" cy="535" r="24" fill="#9faf8b"/>
    <g class="arm-r">
      <line x1="520" y1="400" x2="620" y2="460" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/>
      <circle cx="632" cy="470" r="24" fill="#9faf8b"/>
      <!-- paddle -->
      <line x1="632" y1="470" x2="680" y2="500" stroke="#8b6914" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="710" cy="520" rx="28" ry="36" fill="#c45c5c" stroke="#8b3a3a" stroke-width="3" transform="rotate(25 710 520)"/>
    </g>
    
    <g class="head">
      <line x1="470" y1="330" x2="470" y2="300" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="470" cy="250" r="88.0" fill="url(#skin)"/>
      <line x1="430" y1="180" x2="410" y2="138" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="510" y1="178" x2="532" y2="136" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="407" cy="133" r="11.0" fill="#9faf8b"/>
      <circle cx="535" cy="132" r="11.0" fill="#9faf8b"/>
      <circle cx="425" cy="270" r="16.0" fill="url(#blush)"/>
      <circle cx="520" cy="268" r="15.0" fill="url(#blush)"/>
      <path d="M425 220 Q450 208 472 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M482 218 Q505 206 530 220" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="445" cy="250" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="505" cy="248" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="448" cy="250" r="8.5" fill="#1a1a1a"/>
      <circle cx="508" cy="248" r="8.5" fill="#1a1a1a"/>
      <circle cx="451" cy="245" r="2.8" fill="#fff"/>
      <circle cx="511" cy="243" r="2.8" fill="#fff"/>
      <path d="M445 288 Q475 308 505 286" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="445" cy="208" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
