<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物踢足球动画">
  <!--
    自然颠球循环：球始终在画面里，靠脚颠起再落下，
    身体随重心起伏，避免「踢飞消失再出现」。
  -->
  <defs>
    <style>
      .player {
        animation: sway 0.85s ease-in-out infinite;
        transform-origin: 450px 620px;
      }
      .head {
        animation: head 0.85s ease-in-out infinite;
        transform-origin: 450px 280px;
      }
      .torso {
        animation: torso 0.85s ease-in-out infinite;
        transform-origin: 450px 480px;
      }
      .arm-l {
        animation: arm-l 0.85s ease-in-out infinite;
        transform-origin: 380px 400px;
      }
      .arm-r {
        animation: arm-r 0.85s ease-in-out infinite;
        transform-origin: 520px 400px;
      }
      .leg-l {
        animation: leg-l 0.85s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        transform-origin: 415px 580px;
      }
      .leg-r {
        animation: leg-r 0.85s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        transform-origin: 485px 580px;
      }
      .ball-wrap {
        animation: ball-path 0.85s cubic-bezier(0.33, 0.0, 0.2, 1) infinite;
      }
      .ball-spin {
        animation: ball-spin 0.85s linear infinite;
        transform-origin: 450px 720px;
      }
      .ball-squash {
        animation: ball-squash 0.85s cubic-bezier(0.33, 0.0, 0.2, 1) infinite;
        transform-origin: 450px 720px;
      }
/* 身体随颠球轻晃、略下蹲迎球 */
      @keyframes sway {
        0%, 100% { transform: translateY(0); }
        35% { transform: translateY(6px); }
        55% { transform: translateY(-4px); }
      }
      @keyframes head {
        0%, 100% { transform: rotate(-3deg) translateY(0); }
        40% { transform: rotate(2deg) translateY(4px); }
        60% { transform: rotate(-1deg) translateY(-2px); }
      }
      @keyframes torso {
        0%, 100% { transform: rotate(-1deg) scaleY(1); }
        40% { transform: rotate(1.5deg) scaleY(0.98); }
        55% { transform: rotate(-0.5deg) scaleY(1.01); }
      }
      @keyframes arm-l {
        0%, 100% { transform: rotate(18deg); }
        50% { transform: rotate(-12deg); }
      }
      @keyframes arm-r {
        0%, 100% { transform: rotate(-18deg); }
        50% { transform: rotate(12deg); }
      }

      /*
        左脚为主颠球脚：触球瞬间抬起前踢
        右脚支撑，轻点地面换重心
      */
      @keyframes leg-l {
        0%, 100% { transform: rotate(6deg); }
        28% { transform: rotate(10deg); }
        /* 抬脚迎球并颠起 */
        40% { transform: rotate(-18deg); }
        46% { transform: rotate(-30deg); }
        54% { transform: rotate(-12deg); }
        70% { transform: rotate(8deg); }
      }
      @keyframes leg-r {
        0%, 100% { transform: rotate(-6deg); }
        40% { transform: rotate(4deg); }
        55% { transform: rotate(-10deg); }
      }

      /*
        球路径（相对默认位置 450,720）：
        落地贴脚 → 被颠起 → 最高点 → 落下
        与左脚 40–48% 触球对齐
      */
      @keyframes ball-path {
        /* 缓落 → 触脚 → 弹起（带一点弧）→ 再落 */
        0%   { transform: translate(2px, -40px); }
        32%  { transform: translate(6px, 10px); }
        40%  { transform: translate(4px, 14px); }
        /* 左脚触球约 42–48% */
        48%  { transform: translate(0, 6px); }
        62%  { transform: translate(-12px, -200px); }
        72%  { transform: translate(-16px, -235px); }
        88%  { transform: translate(-6px, -100px); }
        100% { transform: translate(2px, -40px); }
      }
      @keyframes ball-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes ball-squash {
        0%, 100% { transform: scale(1, 1); }
        30% { transform: scale(1.04, 0.94); }
        38% { transform: scale(1.08, 0.9); }
        46% { transform: scale(0.96, 1.06); }
        58%, 95% { transform: scale(1, 1); }
      }
40% { transform: scaleX(1.05); opacity: 0.12; }
        68% { transform: scaleX(0.55); opacity: 0.05; }
      }
    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a9e78"/>
      <stop offset="100%" stop-color="#4d7d5a"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>
    <!--
      经典 Telstar 足球：截角二十面体
      12 黑五边形 + 20 白六边形（每个黑五边形被白六边形包围）
      球面图案参考 Wikimedia Commons Soccerball.svg（公有领域）
    -->
    <radialGradient id="ballShade" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#d5d5d5"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="2376"/>
    </clipPath>
  </defs>

  <!-- 地面投影 -->
<g class="player">
    <!-- 右腿（支撑） -->
    <g class="leg-r">
      <line x1="485" y1="580" x2="530" y2="800" stroke="url(#skin2)" stroke-width="52" stroke-linecap="round"/>
      <!-- 鞋 -->
      <ellipse cx="545" cy="818" rx="40" ry="20" fill="#3d342c" transform="rotate(12 545 818)"/>
      <ellipse cx="555" cy="812" rx="14" ry="8" fill="#5a4a3a" transform="rotate(12 555 812)"/>
    </g>

    <!-- 左腿（颠球） -->
    <g class="leg-l">
      <line x1="415" y1="580" x2="360" y2="790" stroke="url(#skin)" stroke-width="54" stroke-linecap="round"/>
      <ellipse cx="345" cy="810" rx="40" ry="20" fill="#3d342c" transform="rotate(-18 345 810)"/>
      <ellipse cx="332" cy="804" rx="14" ry="8" fill="#5a4a3a" transform="rotate(-18 332 804)"/>
    </g>

    <!-- 躯干 -->
    <g class="torso">
      <ellipse cx="450" cy="480" rx="100" ry="120" fill="url(#skin)"/>
      <!-- 球衣 -->
      <path d="M365 400
               C 380 350, 520 350, 535 400
               L 545 560
               C 530 595, 370 595, 355 560 Z"
            fill="url(#jersey)"/>
      <ellipse cx="450" cy="450" rx="36" ry="24" fill="#fff" opacity="0.12"/>
      <!-- 短裤 -->
      <path d="M365 545 C 380 600, 520 600, 535 545 L 525 620 C 490 640, 410 640, 375 620 Z"
            fill="#3d5a46"/>
    </g>

    <!-- 手臂（张开保持平衡，随颠球小幅摆） -->
    <g class="arm-l">
      <line x1="380" y1="410" x2="280" y2="540" stroke="url(#skin2)" stroke-width="44" stroke-linecap="round"/>
      <circle cx="268" cy="555" r="26" fill="#9faf8b"/>
    </g>
    <g class="arm-r">
      <line x1="520" y1="410" x2="620" y2="540" stroke="#a8b994" stroke-width="44" stroke-linecap="round"/>
      <circle cx="632" cy="555" r="26" fill="#9faf8b"/>
    </g>

    <!-- 头 -->
    <g class="head">
      <line x1="450" y1="380" x2="450" y2="320" stroke="#9faf8b" stroke-width="36" stroke-linecap="round"/>
      <circle cx="450" cy="260" r="92" fill="url(#skin)"/>
      <!-- 触角 -->
      <line x1="408" y1="188" x2="388" y2="145" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <line x1="492" y1="186" x2="514" y2="143" stroke="#9faf8b" stroke-width="14" stroke-linecap="round"/>
      <circle cx="385" cy="140" r="11" fill="#9faf8b"/>
      <circle cx="517" cy="138" r="11" fill="#9faf8b"/>
      <!-- 腮红 -->
      <circle cx="400" cy="280" r="17" fill="url(#blush)"/>
      <circle cx="505" cy="278" r="16" fill="url(#blush)"/>
      <!-- 眉：看球略向下 -->
      <path d="M400 232 Q425 222 448 232" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <path d="M462 230 Q488 220 512 232" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
      <!-- 眼（视线随球，略偏下） -->
      <ellipse cx="425" cy="262" rx="22" ry="20" fill="#fff"/>
      <ellipse cx="485" cy="260" rx="22" ry="20" fill="#fff"/>
      <circle cx="428" cy="268" r="9" fill="#1a1a1a"/>
      <circle cx="488" cy="266" r="9" fill="#1a1a1a"/>
      <circle cx="431" cy="263" r="3" fill="#fff"/>
      <circle cx="491" cy="261" r="3" fill="#fff"/>
      <!-- 专注微笑 -->
      <path d="M428 300 Q455 318 482 298" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="428" cy="218" rx="20" ry="11" fill="#fff" opacity="0.28"/>
    </g>
  </g>

  <!--
    足球球面：Telstar 式黑五边形 / 白六边形
    几何来源：Wikimedia Soccerball.svg（scale 到 r≈44）
  -->
  <g class="ball-wrap">
    <g class="ball-squash">
      <g class="ball-spin">
        <g transform="translate(450 720) scale(0.01852)">
          <!-- 白底 -->
          <circle r="2376" fill="url(#ballShade)"/>
          <!-- 黑色五边形面板（经典可见块） -->
          <g fill="#1a1a1a" clip-path="url(#ballClip)">
            <path d="m-1624-1700c243-153 498-303 856-424 141 117 253 307 372 492-288 275-562 544-724 756-274-25-410-2-740-60 3-244 84-499 236-764zm2904-40c271 248 537 498 724 788-55 262-105 553-180 704-234-35-536-125-820-200-138-357-231-625-340-924 210-156 417-296 616-368zm-3273 3033a2376 2376 0 0 1-378-1392l59-7c54 342 124 674 311 928-36 179-2 323 51 458zm1197-1125c365 60 717 120 1060 180 106 333 120 667 156 1000-263 218-625 287-944 420-372-240-523-508-736-768 122-281 257-561 464-832zm3013 678a2376 2376 0 0 1-925 1147l-116-5c84-127 114-297 118-488 232-111 464-463 696-772 86 30 159 72 227 118zm-2287 1527a2376 2376 0 0 1-993-251c199 74 367 143 542 83 53 75 176 134 451 168z"/>
          </g>
          <!-- 六边形接缝线 -->
          <g fill="none" stroke="#1a1a1a" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#ballClip)">
            <path d="m-1643-1716 155 158m-550 2364c231 231 538 195 826 202m-524-2040c-491 351-610 1064-592 1060m1216-1008c-51 373 84 783 364 1220m-107-2289c157-157 466-267 873-329m-528 4112c-50 132-37 315-8 510m62-3883c282 32 792 74 1196 303m-404 2644c310 173 649 247 1060 180m-340-2008c-242 334-534 645-872 936m1109-2119c-111-207-296-375-499-534m1146 1281c100 3 197 44 290 141m-438 495c158 297 181 718 204 1140"/>
          </g>
          <!-- 外轮廓 -->
          <circle r="2376" fill="none" stroke="#1a1a1a" stroke-width="90"/>
          <!-- 高光 -->
          <ellipse cx="-600" cy="-700" rx="520" ry="360" fill="#fff" opacity="0.28"/>
        </g>
      </g>
    </g>
  </g>
</svg>
