<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物游泳动画（插画拟人）">
  <!-- 透明背景：仅角色 + 游泳动效 -->
  <defs>
    <style>
      .swimmer {
        animation: glide 1.6s ease-in-out infinite;
        transform-origin: 580px 400px;
      }
      .head {
        animation: head-nod 1.6s ease-in-out infinite;
        transform-origin: 720px 300px;
      }
      .arm-hi {
        animation: stroke-hi 1.6s ease-in-out infinite;
        transform-origin: 640px 355px;
      }
      .arm-lo {
        animation: stroke-lo 1.6s ease-in-out infinite;
        transform-origin: 580px 410px;
      }
      .leg-1 {
        animation: kick1 0.55s ease-in-out infinite;
        transform-origin: 400px 430px;
      }
      .leg-2 {
        animation: kick2 0.55s ease-in-out infinite;
        transform-origin: 410px 455px;
      }
      /*
        水效原则：少、轻、跟动作对齐
        - 上手出水瞬间轻溅（与 stroke-hi 峰值同步）
        - 气泡从胸腹缓慢上浮，大小不一、路径微偏
      */
      .splash-hand {
        animation: splash-hand 1.6s ease-in-out infinite;
        transform-origin: 790px 240px;
      }
      .splash-drip {
        animation: splash-drip 1.6s ease-in-out infinite;
        transform-origin: 760px 280px;
      }
      .kick-spark {
        animation: kick-spark 0.55s ease-in-out infinite;
        transform-origin: 260px 560px;
      }

      .bub-a { animation: rise 2.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite; }
      .bub-b { animation: rise 3.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 0.9s; }
      .bub-c { animation: rise 3.1s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 1.6s; }
      .bub-d { animation: rise 3.6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 2.2s; }
      .bub-e { animation: rise 2.9s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 0.4s; }
      .bub-f { animation: rise 3.3s cubic-bezier(0.25, 0.1, 0.25, 1) infinite 1.3s; }

      @keyframes glide {
        0%, 100% { transform: translate(0, 12px) rotate(-10deg); }
        50% { transform: translate(20px, -10px) rotate(-6deg); }
      }
      @keyframes head-nod {
        0%, 100% { transform: rotate(6deg); }
        50% { transform: rotate(0deg) translate(0, -3px); }
      }
      @keyframes stroke-hi {
        0%   { transform: rotate(25deg); }
        30%  { transform: rotate(-70deg); }
        55%  { transform: rotate(-130deg); }
        80%  { transform: rotate(-40deg); }
        100% { transform: rotate(25deg); }
      }
      @keyframes stroke-lo {
        0%   { transform: rotate(0deg); }
        35%  { transform: rotate(55deg); }
        65%  { transform: rotate(20deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes kick1 {
        0%, 100% { transform: rotate(14deg); }
        50% { transform: rotate(-24deg); }
      }
      @keyframes kick2 {
        0%, 100% { transform: rotate(-18deg); }
        50% { transform: rotate(20deg); }
      }

      /* 仅在手臂上扬过顶时出现，短而轻 */
      @keyframes splash-hand {
        0%, 22% { opacity: 0; transform: scale(0.6) translate(0, 8px); }
        32% { opacity: 0.9; transform: scale(1) translate(2px, -4px); }
        48% { opacity: 0.55; transform: scale(1.05) translate(8px, -14px); }
        62%, 100% { opacity: 0; transform: scale(1.1) translate(14px, -22px); }
      }
      @keyframes splash-drip {
        0%, 28% { opacity: 0; transform: translate(0, 0); }
        38% { opacity: 0.75; transform: translate(4px, 6px); }
        55% { opacity: 0.4; transform: translate(6px, 16px); }
        70%, 100% { opacity: 0; transform: translate(8px, 28px); }
      }
      /* 踢腿时脚尖极淡水珠 */
      @keyframes kick-spark {
        0%, 100% { opacity: 0; transform: scale(0.7); }
        45% { opacity: 0.55; transform: scale(1); }
        70% { opacity: 0; transform: scale(1.1) translate(-6px, -4px); }
      }

      /* 气泡：慢、略左右漂，不全透明硬切 */
      @keyframes rise {
        0% {
          transform: translate(0, 0) scale(0.85);
          opacity: 0;
        }
        10% { opacity: 0.7; }
        50% {
          transform: translate(6px, -70px) scale(1);
          opacity: 0.65;
        }
        85% { opacity: 0.35; }
        100% {
          transform: translate(-4px, -150px) scale(1.05);
          opacity: 0;
        }
      }
    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8fa0"/>
      <stop offset="100%" stop-color="#2f6574"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 水效：克制、跟动作同步 -->

  <!-- 上手出水：一小簇水珠 + 两道细弧 -->
  <g class="splash-hand" fill="#6bb8d6" fill-opacity="0.75" stroke="none">
    <path d="M775 255 C 795 225 825 228 830 255" fill="none" stroke="#6bb8d6" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M790 260 C 808 235 835 240 838 262" fill="none" stroke="#8ecce6" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="805" cy="232" r="4.5"/>
    <circle cx="822" cy="225" r="3.5"/>
    <circle cx="838" cy="238" r="3"/>
    <circle cx="812" cy="218" r="2.5"/>
    <circle cx="828" cy="212" r="2"/>
  </g>

  <!-- 手边下落水珠 -->
  <g class="splash-drip" fill="#6bb8d6" fill-opacity="0.65">
    <circle cx="755" cy="275" r="3"/>
    <circle cx="768" cy="288" r="2.2"/>
    <circle cx="748" cy="295" r="1.8"/>
  </g>

  <!-- 踢腿脚尖轻溅 -->
  <g class="kick-spark" fill="#6bb8d6" fill-opacity="0.55">
    <circle cx="245" cy="550" r="3"/>
    <circle cx="232" cy="562" r="2.2"/>
    <circle cx="255" cy="568" r="1.8"/>
  </g>

  <!-- 气泡：6 个，慢升、半透明、大小错落 -->
  <g stroke="#7ebfd9" stroke-width="2" stroke-opacity="0.7">
    <circle class="bub-a" cx="700" cy="520" r="9"  fill="#c5eaf6" fill-opacity="0.4"/>
    <circle class="bub-b" cx="740" cy="545" r="6"  fill="#d2f0f9" fill-opacity="0.45"/>
    <circle class="bub-c" cx="665" cy="500" r="5"  fill="#c5eaf6" fill-opacity="0.4"/>
    <circle class="bub-d" cx="780" cy="560" r="7.5" fill="#b8e4f4" fill-opacity="0.38"/>
    <circle class="bub-e" cx="720" cy="575" r="4"  fill="#d2f0f9" fill-opacity="0.5"/>
    <circle class="bub-f" cx="690" cy="555" r="5.5" fill="#c5eaf6" fill-opacity="0.42"/>
  </g>
  <!-- 小高光 -->
  <g fill="#fff" fill-opacity="0.55">
    <circle class="bub-a" cx="696" cy="515" r="2"/>
    <circle class="bub-b" cx="737" cy="541" r="1.4"/>
    <circle class="bub-d" cx="776" cy="555" r="1.8"/>
  </g>

  <!-- 角色 -->
  <g class="swimmer">
    <g class="leg-2">
      <line x1="410" y1="455" x2="270" y2="575"
            stroke="url(#skin2)" stroke-width="52" stroke-linecap="round"/>
      <ellipse cx="255" cy="585" rx="32" ry="18" fill="#7d926c" transform="rotate(-50 255 585)"/>
    </g>

    <g>
      <ellipse cx="520" cy="405" rx="150" ry="82" fill="url(#skin)" transform="rotate(-14 520 405)"/>
      <ellipse cx="535" cy="398" rx="72" ry="40" fill="#fff" opacity="0.22" transform="rotate(-14 535 398)"/>
      <path d="M405 420
               C 440 470 560 480 630 435
               L 620 480
               C 560 505 450 500 400 465 Z"
            fill="url(#suit)"/>
      <path d="M425 445 Q525 480 605 450" fill="none" stroke="#6aabba" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    </g>

    <g class="leg-1">
      <line x1="400" y1="430" x2="265" y2="555"
            stroke="url(#skin)" stroke-width="54" stroke-linecap="round"/>
      <ellipse cx="250" cy="565" rx="34" ry="19" fill="#8fa67c" transform="rotate(-45 250 565)"/>
    </g>

    <g class="arm-lo">
      <line x1="580" y1="410" x2="720" y2="540"
            stroke="url(#skin2)" stroke-width="48" stroke-linecap="round"/>
      <circle cx="735" cy="555" r="28" fill="#9faf8b"/>
      <ellipse cx="752" cy="568" rx="12" ry="9" fill="#849672" transform="rotate(40 752 568)"/>
    </g>

    <g class="head">
      <line x1="655" y1="360" x2="690" y2="330"
            stroke="#9faf8b" stroke-width="36" stroke-linecap="round"/>
      <circle cx="725" cy="285" r="96" fill="url(#skin)"/>
      <line x1="680" y1="210" x2="658" y2="165" stroke="#9faf8b" stroke-width="15" stroke-linecap="round"/>
      <line x1="770" y1="208" x2="795" y2="162" stroke="#9faf8b" stroke-width="15" stroke-linecap="round"/>
      <circle cx="655" cy="160" r="12" fill="#9faf8b"/>
      <circle cx="798" cy="158" r="12" fill="#9faf8b"/>
      <circle cx="675" cy="310" r="20" fill="url(#blush)"/>
      <circle cx="780" cy="302" r="18" fill="url(#blush)"/>
      <path d="M675 255 Q700 242 722 254" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
      <path d="M742 250 Q768 238 792 252" fill="none" stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="700" cy="285" rx="24" ry="22" fill="#fff"/>
      <ellipse cx="765" cy="280" rx="24" ry="22" fill="#fff"/>
      <circle cx="708" cy="283" r="10" fill="#1a1a1a"/>
      <circle cx="773" cy="278" r="10" fill="#1a1a1a"/>
      <circle cx="712" cy="278" r="3.5" fill="#fff"/>
      <circle cx="777" cy="273" r="3.5" fill="#fff"/>
      <path d="M705 325 Q735 348 768 322" fill="none" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="700" cy="240" rx="24" ry="13" fill="#fff" opacity="0.3"/>
    </g>

    <g class="arm-hi">
      <line x1="640" y1="355" x2="780" y2="230"
            stroke="#a8b994" stroke-width="48" stroke-linecap="round"/>
      <circle cx="795" cy="218" r="28" fill="#9faf8b"/>
      <circle cx="812" cy="202" r="10" fill="#849672"/>
    </g>
  </g>
</svg>
