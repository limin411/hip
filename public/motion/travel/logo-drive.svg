<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物开车">
  <defs>
    <style>

      .player{animation:bob .8s ease-in-out infinite;transform-origin:500px 450px}
      .wheel{animation:wheel .8s ease-in-out infinite;transform-origin:500px 520px}
      .head{animation:h .8s ease-in-out infinite;transform-origin:500px 250px}
      .tree{animation:tree 1.5s linear infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes wheel{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
      @keyframes h{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
      @keyframes tree{from{transform:translateX(0)}to{transform:translateX(-100px)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <!-- car body simple -->
  <rect x="250" y="600" width="500" height="160" rx="40" fill="#4a8fd4"/>
  <path d="M320 600 L380 500 L620 500 L680 600 Z" fill="#6ab0e0"/>
  <rect x="400" y="520" width="80" height="60" rx="6" fill="#a8d4f0" opacity="0.7"/>
  <rect x="520" y="520" width="80" height="60" rx="6" fill="#a8d4f0" opacity="0.7"/>
  <circle cx="350" cy="770" r="40" fill="#222"/><circle cx="650" cy="770" r="40" fill="#222"/>
  <circle cx="350" cy="770" r="18" fill="#888"/><circle cx="650" cy="770" r="18" fill="#888"/>
  <g class="player">
    <ellipse cx="500" cy="420" rx="70" ry="80" fill="url(#skin)"/>
    <path d="M445 370 C455 340 545 340 555 370 L560 450 C545 480 455 480 440 450 Z" fill="#2a4a6a"/>
    <g class="wheel">
      <circle cx="500" cy="520" r="45" fill="none" stroke="#333" stroke-width="10"/>
      <circle cx="500" cy="520" r="12" fill="#555"/>
      <line x1="500" y1="475" x2="500" y2="565" stroke="#555" stroke-width="6"/>
      <line x1="455" y1="520" x2="545" y2="520" stroke="#555" stroke-width="6"/>
    </g>
    <line x1="460" y1="400" x2="470" y2="500" stroke="url(#skin2)" stroke-width="32" stroke-linecap="round"/>
    <line x1="540" y1="400" x2="530" y2="500" stroke="#a8b994" stroke-width="32" stroke-linecap="round"/>
    
    <g class="head">
      <line x1="500" y1="340" x2="500" y2="310" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="260" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="190" x2="440" y2="148" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="188" x2="562" y2="146" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="143" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="142" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="280" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="278" r="15.0" fill="url(#blush)"/>
      <path d="M455 230 Q480 218 502 230" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 228 Q535 216 560 230" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="260" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="258" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="260" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="258" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="255" r="2.8" fill="#fff"/>
      <circle cx="541" cy="253" r="2.8" fill="#fff"/>
      <path d="M475 298 Q505 318 535 296" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="218" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
