<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="吉祥物写代码">
  <defs>
    <style>

      .player{animation:bob 1.5s ease-in-out infinite;transform-origin:500px 520px}
      .type{animation:type .3s ease-in-out infinite;transform-origin:500px 560px}
      .cursor{animation:blink 1s step-end infinite}
      .head{animation:h 1.5s ease-in-out infinite;transform-origin:500px 270px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes h{0%,100%{transform:rotate(5deg) translateY(8px)}50%{transform:rotate(7deg)}}

    </style>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6c5a2"/>
      <stop offset="50%" stop-color="#9faf8b"/>
      <stop offset="100%" stop-color="#849672"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6b892"/>
      <stop offset="100%" stop-color="#7d926c"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b7ad" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f2b7ad" stop-opacity="0"/>
    </radialGradient>


  </defs>

  <!-- monitor -->
  <rect x="320" y="380" width="360" height="240" rx="12" fill="#333"/>
  <rect x="340" y="400" width="320" height="200" rx="4" fill="#1a2a3a"/>
  <text x="360" y="450" fill="#7ec4a0" font-family="monospace" font-size="22">&lt;div&gt;</text>
  <text x="380" y="490" fill="#e07a3a" font-family="monospace" font-size="20">hello()</text>
  <rect class="cursor" x="480" y="510" width="10" height="22" fill="#7ec4e0"/>
  <rect x="460" y="620" width="80" height="20" fill="#555"/>
  <g class="player">
    <line x1="450" y1="680" x2="430" y2="820" stroke="url(#skin2)" stroke-width="46" stroke-linecap="round"/>
    <line x1="550" y1="680" x2="570" y2="820" stroke="url(#skin)" stroke-width="46" stroke-linecap="round"/>
    <ellipse cx="420" cy="838" rx="28" ry="14" fill="#5c4030"/><ellipse cx="580" cy="838" rx="28" ry="14" fill="#5c4030"/>
    <ellipse cx="500" cy="600" rx="90" ry="80" fill="url(#skin)"/>
    <path d="M420 540 C435 500 565 500 580 540 L590 660 C570 700 430 700 410 660 Z" fill="#4a6a8a"/>
    <g class="type">
      <line x1="430" y1="580" x2="420" y2="640" stroke="url(#skin2)" stroke-width="36" stroke-linecap="round"/>
      <circle cx="415" cy="655" r="18" fill="#9faf8b"/>
      <line x1="570" y1="580" x2="580" y2="640" stroke="#a8b994" stroke-width="36" stroke-linecap="round"/>
      <circle cx="585" cy="655" r="18" fill="#9faf8b"/>
    </g>
    <!-- keyboard -->
    <rect x="380" y="670" width="240" height="40" rx="6" fill="#444"/>
    
    <g class="head">
      <line x1="500" y1="360" x2="500" y2="330" stroke="#9faf8b" stroke-width="34.0" stroke-linecap="round"/>
      <circle cx="500" cy="280" r="88.0" fill="url(#skin)"/>
      <line x1="460" y1="210" x2="440" y2="168" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <line x1="540" y1="208" x2="562" y2="166" stroke="#9faf8b" stroke-width="14.0" stroke-linecap="round"/>
      <circle cx="437" cy="163" r="11.0" fill="#9faf8b"/>
      <circle cx="565" cy="162" r="11.0" fill="#9faf8b"/>
      <circle cx="455" cy="300" r="16.0" fill="url(#blush)"/>
      <circle cx="550" cy="298" r="15.0" fill="url(#blush)"/>
      <path d="M455 250 Q480 238 502 250" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <path d="M512 248 Q535 236 560 250" fill="none" stroke="#1a1a1a" stroke-width="10.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="280" rx="21.0" ry="19.0" fill="#fff"/>
      <ellipse cx="535" cy="278" rx="21.0" ry="19.0" fill="#fff"/>
      <circle cx="478" cy="280" r="8.5" fill="#1a1a1a"/>
      <circle cx="538" cy="278" r="8.5" fill="#1a1a1a"/>
      <circle cx="481" cy="275" r="2.8" fill="#fff"/>
      <circle cx="541" cy="273" r="2.8" fill="#fff"/>
      <path d="M475 318 Q505 338 535 316" fill="none" stroke="#1a1a1a" stroke-width="8.0" stroke-linecap="round"/>
      <ellipse cx="475" cy="238" rx="18.0" ry="10.0" fill="#fff" opacity="0.28"/>
    </g>
  </g>

</svg>
