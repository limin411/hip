[package]
name = "hip"
version = "1.0.7"
description = "Desktop AI workbench (Tauri shell + React UI + Node sidecar)"
authors = ["ljm"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Product SSH (russh) is default-on after PR5. Emergency: `--no-default-features` strips SSH.
default = ["ssh"]
# Production SSH interactive shell + TOFU. See docs/design/2026-07-20-terminal-management.md.
ssh = [
    "dep:russh",
    "dep:russh-sftp",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/time",
    "tokio/io-util",
    "tokio/macros",
    "tokio/sync",
    "tokio/fs",
]
# PR0 spike alias — kept so older docs/commands still work.
ssh-spike = ["ssh"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent window + NSVisualEffect vibrancy (App Store ineligible).
# tray-icon: system tray for close-to-hide (docs/design/2026-07-25-window-close-tray.md).
# image-png: load dedicated tray PNG (32/128) instead of only default_window_icon.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-wdio-webdriver = "1"
# Second launch focuses the existing main window (release builds only; see lib.rs).
tauri-plugin-single-instance = "2"
# Launch at login (Phase 3 window / tray).
tauri-plugin-autostart = "2"
# `sync` always; SSH feature expands rt/net/time/io-util/macros (see [features].ssh).
tokio = { version = "1", features = ["sync"] }
# Pinned to 0.12 (rustls-tls): bumping to 0.13 to dedupe the transitive 0.13.4 fails
# here — 0.13's `rustls` feature requires aws-lc-rs ^1.14, unavailable in this index.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Skill install: unzip uploaded skill bundles (zip-slip-safe extraction in skills.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Skill metadata: parse SKILL.md YAML frontmatter (name/description).
serde_yaml = "0.9"
# Unified TOML config I/O (skill-mcp-overhaul wave 1).
toml = "0.8"
dirs = "6"
# Interactive code-panel terminal (PR-2): PTY + base64 event payloads.
portable-pty = "0.9"
base64 = "0.22"
# Voice model SHA-256 verification (whisper ggml downloads).
sha2 = "0.10"
# Process-group kill for PTY children (Unix).
libc = "0.2"
# Knowledge link index (per-space SQLite under .hip/).
rusqlite = { version = "0.32", features = ["bundled"] }
# Product SSH client (feature `ssh`, default-on). Default crypto = aws-lc-rs + flate2 + rsa.
# Resolves to 0.54.5 (0.54.6 blocked: yanked libcrux-ml-kem). cargo may warn future-incompat —
# bump policy in docs/design/2026-07-20-terminal-ssh-spike.md.
russh = { version = "0.54", optional = true }
# SFTP subsystem on the same russh client (PR6). Matches russh 0.54 example stack.
russh-sftp = { version = "2.1", optional = true }

