[package]
name = "hip"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# PR0 spike: optional russh compile path. Not on by default — default `cargo check` stays clean.
# PR5 will promote to a product `ssh` feature (default-on for release). See docs/design/2026-07-20-terminal-ssh-spike.md.
ssh-spike = [
    "dep:russh",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/time",
    "tokio/io-util",
    "tokio/macros",
    "tokio/sync",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent window + NSVisualEffect vibrancy (App Store ineligible).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-wdio-webdriver = "1"
tokio = { version = "1", features = ["sync"] }
# Pinned to 0.12 (rustls-tls): bumping to 0.13 to dedupe the transitive 0.13.4 fails
# here — 0.13's `rustls` feature requires aws-lc-rs ^1.14, unavailable in this index.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Skill install: unzip uploaded skill bundles (zip-slip-safe extraction in skills.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Skill metadata: parse SKILL.md YAML frontmatter (name/description).
serde_yaml = "0.9"
# Unified TOML config I/O (skill-mcp-overhaul wave 1).
toml = "0.8"
dirs = "6"
# Interactive code-panel terminal (PR-2): PTY + base64 event payloads.
portable-pty = "0.9"
base64 = "0.22"
# Process-group kill for PTY children (Unix).
libc = "0.2"
# Knowledge link index (per-space SQLite under .hip/).
rusqlite = { version = "0.32", features = ["bundled"] }
# PR0 SSH spike only (`ssh-spike` feature). Default crypto backend = aws-lc-rs + flate2 + rsa.
# See docs/design/2026-07-20-terminal-ssh-spike.md for ring alternative and size notes.
russh = { version = "0.54", optional = true }

